// ──── 품목 자동완성 ────
function ioItemSearch(inp){
  const dd = document.getElementById('ioItemDrop');
  if(!dd) return;
  // 마지막 쉼표 뒤 부분을 검색어로
  const val = inp.value || '';
  const parts = val.split(',');
  const lastPart = parts[parts.length-1].trim().toLowerCase();
  if(!lastPart || !productDB.length){
    dd.style.display = 'none';
    return;
  }
  const matches = productDB.filter(p =>
    (p.name||'').toLowerCase().includes(lastPart) ||
    (p.code||'').toLowerCase().includes(lastPart)
  ).slice(0, 8);
  if(!matches.length){
    dd.style.display = 'none';
    return;
  }
  dd.innerHTML = matches.map(p => {
    const img = p.imgs && p.imgs.length ? (typeof p.imgs[0]==='string'?p.imgs[0]:(p.imgs[0].url||'')) : '';
    const stock = +p.stock||0, safety = +p.safetyStock||0;
    const stockCls = stock<=0?'out':(safety>0&&stock<=safety?'low':'');
    const safe = (p.name||'').replace(/'/g,"\\'");
    return `<div onmousedown="_pickIoItem('${safe}')" style="display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--bdr-lt)" onmouseover="this.style.background='var(--s2)'" onmouseout="this.style.background=''">
      <div style="width:32px;height:32px;border-radius:4px;background:var(--s2);border:1px solid var(--bdr-lt);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--t3)">${img?`<img src="${img}" style="width:100%;height:100%;object-fit:cover">`:'📦'}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:12.5px;font-weight:600;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(p.name||'')}</div>
        ${p.code?`<div style="font-size:10px;color:var(--gold-lt);font-family:monospace">${escapeHtml(p.code)}</div>`:''}
      </div>
      <span class="prod-stock ${stockCls}" style="margin:0">재고 ${stock}</span>
    </div>`;
  }).join('');
  dd.style.display = 'block';
}
function _pickIoItem(name){
  const inp = document.getElementById('io_items');
  if(!inp) return;
  const val = inp.value || '';
  const parts = val.split(',');
  parts[parts.length-1] = ' ' + name;  // 마지막 부분을 선택값으로 교체
  inp.value = parts.join(',').replace(/^\s*,/,'').replace(/^\s+/,'') + ', ';
  inp.focus();
  const dd = document.getElementById('ioItemDrop');
  if(dd) dd.style.display = 'none';
}

// ──── 품목 다중 선택 모달 ────
// 제품DB 전체를 카드 리스트로 보여주고 체크박스로 여러 개를 한 번에 선택해서 품목 칸에 추가
// 주의: openModal이 기존 모달을 대체하므로, 입출고 모달 상태를 임시 저장 후 복원
let _ioItemPickerSel = new Set();
let _ioFormBackup = null; // {ioId, fields, photos}

function openIoItemPicker(){
  if(!productDB || !productDB.length){
    showToast('⚠ 제품 DB에 등록된 제품이 없습니다', 'warn');
    return;
  }
  // 1) 현재 입출고 모달의 모든 입력값 백업
  const getVal = id => document.getElementById(id)?.value || '';
  _ioFormBackup = {
    ioId: window._currentIoFormId, // openIoForm 진입 시 저장됨
    fields: {
      io_date: getVal('io_date'),
      io_kind: getVal('io_kind'),
      io_flow: getVal('io_flow'),
      io_vendor: getVal('io_vendor'),
      io_qty: getVal('io_qty'),
      io_invoice: getVal('io_invoice'),
      io_items: getVal('io_items'),
      io_title: getVal('io_title'),
      io_memo: getVal('io_memo'),
      io_user: getVal('io_user'),
      io_applyStock: document.getElementById('io_applyStock')?.checked || false,
    }
  };

  // 이미 입력된 품목들은 미리 체크 상태로 표시
  const existing = (_ioFormBackup.fields.io_items||'')
    .split(',').map(s=>s.trim()).filter(Boolean);
  _ioItemPickerSel = new Set(existing);

  const body = `
    <div class="search-wrap" style="margin-bottom:8px">
      <input type="text" id="ipick_search" placeholder="품명·품번 검색" oninput="_renderIoItemPicker()" autocomplete="off">
    </div>
    <div id="ipick_count" style="font-size:11.5px;color:var(--t3);margin-bottom:8px;padding:0 2px"></div>
    <div id="ipick_list" style="max-height:55vh;overflow-y:auto;border:1px solid var(--bdr-lt);border-radius:6px;background:var(--s1)"></div>
    <div class="spacer"></div>
    <div style="display:flex;gap:8px">
      <button class="btn-secondary" onclick="_cancelIoItemPicker()" style="flex:1">취소</button>
      <button class="btn-primary" id="ipick_apply" onclick="_applyIoItemPicker()" style="flex:2">선택 적용</button>
    </div>
  `;
  openModal('📦 품목 선택', body);
  _renderIoItemPicker();
}

function _renderIoItemPicker(){
  const q = (document.getElementById('ipick_search')?.value||'').trim().toLowerCase();
  let list = productDB.slice();
  if(q){
    list = list.filter(p =>
      (p.name||'').toLowerCase().includes(q) ||
      (p.code||'').toLowerCase().includes(q)
    );
  }
  // 선택된 항목 먼저 정렬
  list.sort((a,b)=>{
    const aSel = _ioItemPickerSel.has(a.name||'') ? 0 : 1;
    const bSel = _ioItemPickerSel.has(b.name||'') ? 0 : 1;
    if(aSel !== bSel) return aSel - bSel;
    return (a.name||'').localeCompare(b.name||'', 'ko');
  });

  const cnt = document.getElementById('ipick_count');
  if(cnt) cnt.textContent = `${list.length}개 표시 · ${_ioItemPickerSel.size}개 선택됨`;

  const apply = document.getElementById('ipick_apply');
  if(apply) apply.textContent = `선택 적용 (${_ioItemPickerSel.size})`;

  const el = document.getElementById('ipick_list');
  if(!el) return;
  if(!list.length){
    el.innerHTML = `<div style="padding:30px 12px;text-align:center;color:var(--t3);font-size:12px">검색 결과가 없습니다</div>`;
    return;
  }
  el.innerHTML = list.map(p => {
    const img = p.imgs && p.imgs.length ? (typeof p.imgs[0]==='string'?p.imgs[0]:(p.imgs[0].url||'')) : '';
    const stock = +p.stock||0, safety = +p.safetyStock||0;
    const stockCls = stock<=0?'out':(safety>0&&stock<=safety?'low':'');
    const checked = _ioItemPickerSel.has(p.name||'');
    const safeName = (p.name||'').replace(/'/g,"\\'");
    return `<label style="display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer;border-bottom:1px solid var(--bdr-lt);${checked?'background:var(--gold-bg)':''}">
      <input type="checkbox" ${checked?'checked':''} onchange="_toggleIoItemPick('${safeName}', this.checked)" style="width:18px;height:18px;margin:0;flex-shrink:0">
      <div style="width:36px;height:36px;border-radius:5px;background:var(--s2);border:1px solid var(--bdr-lt);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t3)">${img?`<img src="${img}" style="width:100%;height:100%;object-fit:cover">`:'📦'}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:12.5px;font-weight:600;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(p.name||'')}</div>
        ${p.code?`<div style="font-size:10px;color:var(--gold-lt);font-family:monospace">${escapeHtml(p.code)}</div>`:''}
      </div>
      <span class="prod-stock ${stockCls}" style="margin:0;flex-shrink:0">재고 ${stock}</span>
    </label>`;
  }).join('');
}

function _toggleIoItemPick(name, checked){
  if(checked) _ioItemPickerSel.add(name);
  else _ioItemPickerSel.delete(name);
  // 카운트와 버튼만 갱신
  const cnt = document.getElementById('ipick_count');
  if(cnt){

// ──── 저장 ────
async function saveIo(ioId){
  const date = document.getElementById('io_date').value || todayStr();
  const kind = document.getElementById('io_kind').value;
  if(!kind){ showToast('구분을 선택해주세요','warn'); return; }
  const isEdit = !!ioId;
  const old = isEdit ? ioItems.find(x=>x.id==ioId) : null;

  // 자동 제목 생성
  let title = document.getElementById('io_title').value.trim();
  if(!title){
    const vendor = document.getElementById('io_vendor').value.trim();
    title = vendor ? `${vendor}_${kind}` : `${kind} ${date}`;
  }

  const applyStock = document.getElementById('io_applyStock').checked;

  const updated = {
    ...(old||{}),
    id: isEdit ? old.id : Date.now(),
    date, kind, title,
    flow: document.getElementById('io_flow').value,
    vendor: document.getElementById('io_vendor').value.trim(),
    qty: +document.getElementById('io_qty').value || 0,
    invoiceNo: document.getElementById('io_invoice').value.trim(),
    items: document.getElementById('io_items').value.trim(),
    memo: document.getElementById('io_memo').value.trim(),
    user: document.getElementById('io_user').value.trim(),
    applyStock,
    files: _photoGet('ioAdd'),
    createdAt: (old && old.createdAt) || new Date().toISOString()
  };

  // 노션 동기화
  if(notionCfg && notionCfg.workerUrl && notionCfg.ioDb){
    showToast('🔄 노션 ' + (isEdit?'수정':'등록') + ' 중...','info');
    try{
      const props = {
        "제목":{title:[{text:{content:title}}]},
        "구분":{select:{name:kind}},
        "일자":{date:{start:date}},
        "고객사/공장":{rich_text:[{text:{content:updated.vendor||''}}]},
        "품목":{rich_text:[{text:{content:updated.items||''}}]},
        "송장번호":{rich_text:[{text:{content:updated.invoice||updated.invoiceNo||''}}]},
        "메모":{rich_text:[{text:{content:updated.memo||''}}]},
        "등록자":{rich_text:[{text:{content:updated.user||''}}]},
        "수량":{number:+updated.qty||null}
      };
      // 사진 — 외부 URL만 노션에 보낼 수 있음 (R2 업로드된 것만)
      const externalFiles = (updated.files||[]).filter(f=>f.url && f.url.startsWith('http'))
        .slice(0,10)
        .map(f=>({name: f.name||'photo', type:'external', external:{url: f.url}}));
      if(externalFiles.length) props["사진"] = {files: externalFiles};
      if(updated.flow) props["흐름"] = {select:{name:updated.flow}};
      // 커머스 필드
      if(updated.brand)        props["자체브랜드"] = {select:{name: updated.brand}};
      if(updated.recipient)    props["수령인"]    = {rich_text:[{text:{content:(updated.recipient||'').slice(0,200)}}]};
      if(updated.phone)        props["연락처"]    = {phone_number:(updated.phone||'').slice(0,50)};
      if(updated.address)      props["주소"]      = {rich_text:[{text:{content:(updated.address||'').slice(0,2000)}}]};
      if(updated.deliveryMemo) props["배송메모"]   = {rich_text:[{text:{content:(updated.deliveryMemo||'').slice(0,2000)}}]};
      if(updated.matchStatus)  props["매칭상태"]   = {select:{name: updated.matchStatus}};
      // 교환/환불 필드
      if(updated.returnStatus)      props["반품상태"]   = {select:{name: updated.returnStatus}};
      if(updated.returnReason)      props["반품사유"]   = {rich_text:[{text:{content:(updated.returnReason||'').slice(0,2000)}}]};
      if(updated.returnRequestedAt) props["반품요청일"] = {date:{start: updated.returnRequestedAt}};
      if(updated.returnCompletedAt) props["반품입고일"] = {date:{start: updated.returnCompletedAt}};

      if(isEdit && updated._notionId){
        await nUpdate(updated._notionId, props);
      } else {
        const res = await nCreate(notionCfg.ioDb, props);
        if(res && res.id) updated._notionId = res.id;
      }
      showToast('✓ ' + (isEdit?'수정':'등록') + ' 완료','success');
    }catch(e){
      console.error(e);
      showToast('로컬에만 저장됨','warn');
    }
  } else {
    showToast('✓ ' + (isEdit?'수정':'등록') + ' (로컬)','success');
  }

  if(isEdit){
    const i = ioItems.findIndex(x=>x.id==ioId);
    if(i>=0) ioItems[i] = updated;
  } else {
    ioItems.unshift(updated);
  }

  // 재고 자동 반영 (신규일 때만)
  if(applyStock && !isEdit){
    const applied = _applyIoToStock(updated);
    if(applied > 0){
      showToast(`✓ 등록 완료 · 재고 ${applied}건 반영됨`,'success');
    }
  }

  saveAll();
  closeModal();
  renderIoList();
  renderDash();
}

// 재고 자동 반영 헬퍼
function _applyIoToStock(io){
  if(!Array.isArray(productDB) || !productDB.length) return 0;
  if(!io.items) return 0;
  const parts = io.items.split(/[,\n;]+/).map(s=>s.trim()).filter(Boolean);
  const sign = io.kind === '입고' ? 1 : (io.kind === '출고' ? -1 : 0);
  if(!sign) return 0;
  let applied = 0;
  parts.forEach(part => {
    // "품목명 30개" 형태에서 수량 추출
    const m = part.match(/^(.+?)\s*(\d+)\s*(?:개|EA|ea|pcs)?$/);
    const name = m ? m[1].trim() : part;
    const qty = m ? parseInt(m[2],10) : io.qty;
    if(!qty) return;
    const prod = productDB.find(p =>
      (p.name||'').toLowerCase() === name.toLowerCase() ||
      (p.code||'').toLowerCase() === name.toLowerCase()
    );
    if(prod){
      const prevStock = +prod.stock||0;
      prod.stock = prevStock + (sign * qty);
      // 재고 이력 기록
      stockHistory.push({
        id: Date.now() + Math.floor(Math.random()*1000),
        productId: prod.id,
        productName: prod.name || '',
        productCode: prod.code || '',
        delta: sign * qty,
        prevStock,
        newStock: prod.stock,
        type: sign>0 ? 'order_recv' : 'order_ship',
        note: `[모바일 IO] ${io.title||''}`,
        when: new Date().toISOString(),
        by: 'mobile'
      });
      // 노션 동기화
      if(prod._notionId && notionCfg && notionCfg.workerUrl){
        nUpdate(prod._notionId, {"재고수량":{number:prod.stock}}).catch(()=>{});
      }
      applied++;
    }
  });
  return applied;
}

async function deleteIo(ioId){
  const io = ioItems.find(x=>x.id==ioId);
  if(!io) return;
  if(!confirm(`이 기록 "${io.title||io.vendor}"을(를) 삭제할까요?`)) return;
  if(io._notionId && notionCfg && notionCfg.workerUrl){

      await notionProxy(`/pages/${io._notionId}`, {method:'PATCH', body:JSON.stringify({archived:true})});
    }catch(e){

  }
  ioItems = ioItems.filter(x=>x.id!=ioId);
  saveAll();
  closeModal();
  renderIoList();
  showToast('✓ 삭제됨','success');
}

// 초기화

// ════════════════════════════════════════════
// 🔄 버전 관리 & 자동 캐시 비우기
// ════════════════════════════════════════════
// 새 버전 배포 시 이 숫자만 올리면 → 기존 사용자 자동 캐시 클리어 + 새로고침
// ⚠️ 배포 시마다 반드시 이 번호를 올려야 모바일 캐시가 자동으로 비워집니다 (YYYY-MM-DD-NN)
const APP_VERSION = '2026-05-16-05';

async function checkAppVersion(){
  const savedVer = localStorage.getItem('ek_app_version');
  if(savedVer === APP_VERSION){
    // 같은 버전 — 정상 진행
    return false;
  }
  // 최초 실행이면 그냥 저장만
  if(!savedVer){
    localStorage.setItem('ek_app_version', APP_VERSION);
    return false;
  }
  // 버전이 다름 → 캐시 비우기
  console.log(`[버전 변경] ${savedVer} → ${APP_VERSION} — 캐시 비우는 중...`);
  showToast('🔄 새 버전 감지 — 캐시 비우는 중...', 'info');

  try{
    // 1. Service Worker 등록 해제 (혹시 있으면)
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      for(const reg of regs){ await reg.unregister(); }
    }
    // 2. Cache API 비우기 (브라우저 캐시)
    if('caches' in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  }catch(e){
    console.warn('캐시 비우기 일부 실패:', e);
  }

  // 3. 버전 업데이트
  localStorage.setItem('ek_app_version', APP_VERSION);
  // 4. 강제 새로고침 (캐시 무시)
  setTimeout(()=>{
    // URL에 timestamp 붙여서 강제 새로 다운로드
    const url = new URL(window.location.href);
    url.searchParams.set('_v', APP_VERSION);
    window.location.replace(url.toString());
  }, 800);
  return true;  // 새로고침 진행 중 → 나머지 init 중단
}

window.onload = async ()=>{
  // 🔄 먼저 버전 체크
  const isReloading = await checkAppVersion();
  if(isReloading) return;  // 새로고침 진행 중이면 init 중단

  loadAll();
  // 알림 로드 + 배지 표시
  _loadNotifs();
  _renderNotifBadge();
  // 버전 표시
  const verEl = document.getElementById('appVer');
  if(verEl) verEl.textContent = 'v' + APP_VERSION.slice(-2);
  renderDash();

  // 알림: 노션 미설정 시 안내
  if(!notionCfg || !notionCfg.workerUrl){
    setTimeout(()=>{
      showToast('⚙ 좌측 상단 EK 로고 클릭 → 노션 설정','info');
    }, 800);
    return;
  }

  // 🔄 자동 동기화 시작
  // 1) 페이지 로드 직후 첫 동기화 (silent — 토스트 안 띄움)
  //    로컬에 옛 데이터가 있어도 노션 최신으로 덮어씀
  setTimeout(()=>autoSync(0), 200);
  // 2) 주기/포커스/온라인 이벤트 리스너 등록
  setupAutoSync();
};
</script>

</body>
</html>
