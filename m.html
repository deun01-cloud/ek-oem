<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FAF8F3">
<!-- 🔄 캐시 방지 — 항상 최신 파일 받기 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>EK OEM · Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F3;--s1:#FFFEFB;--s2:#F5F1E8;--s3:#EDE7DA;
  --bdr:#E5DCC8;--bdr-lt:#F0EADD;
  --t1:#2A2620;--t2:#5A5248;--t3:#8B8478;
  --gold:#8B6914;--gold-lt:#6B4E0A;--gold-bg:rgba(139,105,20,.08);--gold-line:rgba(139,105,20,.22);
  --grn:#2E8B2C;--grn-bg:rgba(46,139,44,.08);
  --red:#C03030;--red-bg:rgba(192,48,48,.08);
  --blu:#1A6DB5;--blu-bg:rgba(26,109,181,.08);
  --org:#A85A10;--org-bg:rgba(168,90,16,.08);
  --prp:#5040A0;--prp-bg:rgba(80,64,160,.08);
  --r:9px;--r2:7px;
  --safe-top:env(safe-area-inset-top,0);
  --safe-bot:env(safe-area-inset-bottom,0);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--t1);font-family:'Noto Sans KR',-apple-system,sans-serif;font-size:14px;line-height:1.5;overscroll-behavior-y:contain}
body{padding-top:calc(54px + var(--safe-top));padding-bottom:calc(64px + var(--safe-bot));min-height:100vh}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}

.topbar{position:fixed;top:0;left:0;right:0;height:calc(54px + var(--safe-top));padding-top:var(--safe-top);background:var(--s1);border-bottom:1px solid var(--bdr);z-index:100;display:flex;align-items:center;justify-content:space-between;padding-left:16px;padding-right:16px}
.brand{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--gold-lt);letter-spacing:.5px}
.brand small{font-size:10.5px;color:var(--t3);font-weight:400;font-family:'Noto Sans KR';margin-left:4px;letter-spacing:0}
.tb-right{display:flex;gap:6px;align-items:center}
.sync-btn{padding:7px 11px;border:1px solid var(--gold-line);background:var(--gold-bg);color:var(--gold-lt);border-radius:6px;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:5px}
.sync-btn:active{transform:scale(.96)}
.sync-btn.syncing{opacity:.6}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--grn)}
.sync-btn.syncing .sync-dot{background:var(--org);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* 알림 버튼 + 패널 */
.notif-btn{position:relative;width:36px;height:32px;border:1px solid var(--bdr);background:var(--s1);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;padding:0}
.notif-btn:active{transform:scale(.96)}
.notif-btn.has-unread{background:var(--gold-bg);border-color:var(--gold-line)}
.notif-ico{font-size:15px;line-height:1}
.notif-cnt{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:9.5px;font-weight:700;padding:0 4px;display:flex;align-items:center;justify-content:center;line-height:1;border:1.5px solid var(--bg)}
.notif-panel{position:fixed;top:54px;right:8px;width:min(360px,calc(100vw - 16px));max-height:calc(100vh - 70px);background:var(--s1);border:1px solid var(--bdr);border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.18);z-index:250;display:flex;flex-direction:column;overflow:hidden}
.notif-panel-h{padding:10px 14px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;background:var(--s2);flex-shrink:0}
.notif-panel-h .t{font-size:13.5px;font-weight:700;color:var(--t1)}
.notif-panel-b{flex:1;overflow-y:auto;padding:4px 0;min-height:80px}
.notif-item{display:flex;gap:9px;padding:10px 14px;border-bottom:1px solid var(--bdr-lt);cursor:pointer;transition:background .12s}
.notif-item:active{background:var(--s2)}
.notif-item.unread{background:var(--gold-bg)}
.notif-item.unread::before{content:'';position:absolute;left:6px;top:50%;transform:translateY(-50%);width:6px;height:6px;border-radius:50%;background:var(--gold-lt)}
.notif-item{position:relative;padding-left:18px}
.notif-item .ico{font-size:18px;flex-shrink:0;line-height:1;margin-top:2px}
.notif-item .body{flex:1;min-width:0}
.notif-item .msg{font-size:12.5px;color:var(--t1);line-height:1.4;font-weight:500;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.notif-item .time{font-size:10px;color:var(--t3);margin-top:3px}
.notif-empty{padding:30px 16px;text-align:center;color:var(--t3);font-size:12px}

.botnav{position:fixed;bottom:0;left:0;right:0;height:calc(64px + var(--safe-bot));padding-bottom:var(--safe-bot);background:var(--s1);border-top:1px solid var(--bdr);display:grid;grid-template-columns:repeat(5,1fr);z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--t3);font-size:10px;font-weight:600;transition:color .15s;position:relative}
.nav-item.active{color:var(--gold-lt)}
.nav-item .ico{font-size:20px;line-height:1}
.nav-item:active{background:var(--s2)}
.nav-badge{position:absolute;top:4px;right:50%;margin-right:-22px;min-width:14px;height:14px;border-radius:7px;background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:0 4px;display:flex;align-items:center;justify-content:center;line-height:1}

.page{padding:14px;display:none;animation:fadeIn .2s}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.card-h{padding:12px 14px;border-bottom:1px solid var(--bdr-lt);display:flex;align-items:center;justify-content:space-between}
.card-h-t{font-size:13.5px;font-weight:700;color:var(--t1)}
.card-h-t .cnt{font-size:11px;font-weight:500;color:var(--t3);margin-left:4px}
.card-b{padding:12px 14px}

.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.kpi-c{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--r);padding:11px 12px}
.kpi-c .l{font-size:10.5px;color:var(--t3);font-weight:500;margin-bottom:4px}
.kpi-c .v{font-size:22px;font-weight:700;color:var(--t1);font-family:'Cormorant Garamond',serif;line-height:1}
.kpi-c .v small{font-size:11px;color:var(--t3);font-weight:500;margin-left:3px;font-family:'Noto Sans KR'}
.kpi-c.kg .v{color:var(--gold-lt)}
.kpi-c.kr .v{color:var(--red)}
.kpi-c.kn .v{color:var(--grn)}
.kpi-c.kb .v{color:var(--blu)}

.cal-h{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;margin-bottom:6px}
.cal-h .mo{font-size:18px;font-weight:700;color:var(--t1);font-family:'Cormorant Garamond',serif;letter-spacing:.5px}
.cal-h-btns{display:flex;gap:4px}
.cal-h-btns button{width:30px;height:30px;border-radius:6px;background:var(--s2);font-size:14px;color:var(--t2);font-weight:600;display:flex;align-items:center;justify-content:center}
.cal-h-btns button:active{background:var(--s3)}
.cal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--bdr-lt);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden}
.cal-dh{background:var(--s2);text-align:center;padding:6px 0;font-size:10.5px;font-weight:600;color:var(--t2)}
.cal-dh.sun{color:var(--red)}
.cal-dh.sat{color:var(--blu)}
.cal-c{background:var(--s1);min-height:56px;padding:3px;font-size:10px;display:flex;flex-direction:column;gap:1px;cursor:pointer}
.cal-c.other{background:var(--s2);opacity:.5}
.cal-c .dn{font-size:11px;font-weight:600;color:var(--t2);margin-bottom:1px}
.cal-c.sun .dn{color:var(--red)}
.cal-c.sat .dn{color:var(--blu)}
.cal-c.holiday .dn{color:var(--red)}
.cal-c.today .dn{background:var(--gold-lt);color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px}
.cal-c.has-ev{background:var(--gold-bg)}
.cal-ev{font-size:9px;padding:1px 3px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.cal-ev.ord{background:var(--org-bg);color:var(--org)}
.cal-ev.smp{background:var(--blu-bg);color:var(--blu)}
.cal-ev.ship{background:var(--red-bg);color:var(--red)}
.cal-ev.task{background:var(--grn-bg);color:var(--grn)}
.cal-ev.done{text-decoration:line-through;opacity:.5}
.cal-ev-more{font-size:8.5px;color:var(--t3);text-align:right;padding:0 2px}

.day-pop{position:fixed;left:0;right:0;bottom:calc(64px + var(--safe-bot));background:var(--s1);border-top:2px solid var(--gold-line);box-shadow:0 -8px 24px rgba(0,0,0,.08);max-height:70vh;overflow-y:auto;border-top-left-radius:14px;border-top-right-radius:14px;z-index:90;transform:translateY(100%);transition:transform .25s ease}
.day-pop.open{transform:translateY(0)}
.day-pop-h{position:sticky;top:0;background:var(--s1);padding:14px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;z-index:1}
.day-pop-h .dt{font-size:16px;font-weight:700;color:var(--t1);font-family:'Cormorant Garamond',serif}
.day-pop-h button{padding:6px 10px;background:var(--s2);border-radius:6px;font-size:12px;color:var(--t2)}
.day-pop-b{padding:10px 14px 80px}

.list-item{padding:12px 14px;border-bottom:1px solid var(--bdr-lt);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:background .15s}
.list-item:active{background:var(--s2)}
.list-item:last-child{border-bottom:none}
.li-h{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.li-vendor{font-size:14px;font-weight:600;color:var(--t1);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-init{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:5px;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:0}
.li-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--t2)}
.li-meta .lbl{color:var(--t3);font-size:10.5px}

.li-status{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:9px;letter-spacing:.2px}
.s-prog{background:var(--gold-bg);color:var(--gold-lt)}
.s-make{background:var(--blu-bg);color:var(--blu)}
.s-fix{background:var(--org-bg);color:var(--org)}
.s-hold{background:var(--prp-bg);color:var(--prp)}
.s-done{background:var(--grn-bg);color:var(--grn)}
.s-cancel{background:var(--red-bg);color:var(--red);text-decoration:line-through}
.s-req{background:var(--gold-bg);color:var(--gold-lt)}

.dday{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:9px;font-family:'Cormorant Garamond',serif;letter-spacing:.3px}
.dd-urg{background:var(--red);color:#fff}
.dd-warn{background:var(--org);color:#fff}
.dd-ok{background:var(--gold-bg);color:var(--gold-lt)}
.dd-done{background:var(--grn-bg);color:var(--grn)}
.li-rows{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.li-rows .item{font-size:10.5px;background:var(--s2);padding:2px 7px;border-radius:4px;color:var(--t2);border:1px solid var(--bdr-lt);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fbar{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.fbar::-webkit-scrollbar{display:none}
.fbar button{flex-shrink:0;padding:6px 12px;background:var(--s2);border-radius:14px;font-size:11.5px;font-weight:600;color:var(--t2);border:1px solid transparent;white-space:nowrap}
.fbar button.active{background:var(--gold-lt);color:#fff;border-color:var(--gold-lt)}

/* 고객사 필터 바 (서브 필터) */
.cli-fbar{display:flex;gap:5px;overflow-x:auto;padding:0 0 8px;-webkit-overflow-scrolling:touch;margin-top:-4px}
.cli-fbar::-webkit-scrollbar{display:none}
.cli-fbar button{flex-shrink:0;padding:5px 10px;background:var(--s1);border:1px solid var(--bdr);border-radius:12px;font-size:11px;font-weight:600;color:var(--t2);white-space:nowrap;display:flex;align-items:center;gap:5px}
.cli-fbar button.active{background:var(--gold-bg);color:var(--gold-lt);border-color:var(--gold-line)}
.cli-fbar .cli-bdg{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:3px;font-size:8.5px;font-weight:700;color:#fff;letter-spacing:0}
.cli-fbar .cli-cnt{font-size:9.5px;color:var(--t3);font-weight:500;margin-left:1px}
.cli-fbar button.active .cli-cnt{color:var(--gold-lt)}

.fab{position:fixed;right:16px;bottom:calc(80px + var(--safe-bot));width:54px;height:54px;border-radius:50%;background:var(--gold-lt);color:#fff;font-size:26px;font-weight:300;box-shadow:0 4px 12px rgba(139,105,20,.4);display:flex;align-items:center;justify-content:center;z-index:80;transition:transform .15s}
.fab:active{transform:scale(.92)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;animation:fadeIn .2s}
.modal.open{display:flex}
.modal-box{width:100%;background:var(--s1);border-top-left-radius:18px;border-top-right-radius:18px;max-height:92vh;display:flex;flex-direction:column;animation:slideUp .25s ease;position:relative}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-h .t{font-size:15px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.modal-h .close{padding:6px 10px;background:var(--s2);border-radius:6px;font-size:12px;color:var(--t2)}
.modal-h .edit{padding:6px 11px;background:var(--gold-lt);color:#fff;border-radius:6px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px}
.modal-h .edit:active{background:var(--gold)}
.modal-b{padding:16px 18px 100px;overflow-y:auto;flex:1}
.modal-foot{padding:12px 18px calc(12px + var(--safe-bot));background:var(--s1);border-top:1px solid var(--bdr);display:flex;gap:8px;flex-shrink:0}

.form-r{margin-bottom:14px}
.form-r label{display:block;font-size:11px;font-weight:600;color:var(--t3);margin-bottom:5px;letter-spacing:.2px}
.form-r .req{color:var(--red);margin-left:2px}
.form-r input,.form-r textarea,.form-r select{width:100%;padding:11px 12px;background:var(--s1);border:1px solid var(--bdr);border-radius:7px;font-size:14px;color:var(--t1)}
.form-r input:focus,.form-r textarea:focus,.form-r select:focus{outline:none;border-color:var(--gold-lt);background:#fff}
.form-r textarea{min-height:70px;resize:vertical;font-family:inherit}
.form-r-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.form-r-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}

.form-pills{display:flex;flex-wrap:wrap;gap:6px}
.form-pills button{padding:9px 14px;background:var(--s2);border-radius:7px;font-size:12.5px;font-weight:600;color:var(--t2);transition:all .15s}
.form-pills button.active{background:var(--gold-lt);color:#fff}
.form-pills button:active{transform:scale(.96)}

.btn-primary{width:100%;padding:13px;background:var(--gold-lt);color:#fff;border-radius:8px;font-size:14px;font-weight:700;letter-spacing:.3px}
.btn-primary:active{background:var(--gold)}
.btn-primary:disabled{background:var(--s3);color:var(--t3);cursor:not-allowed}
.btn-secondary{width:100%;padding:11px;background:var(--s2);color:var(--t2);border-radius:8px;font-size:13px;font-weight:600}
.btn-danger{width:100%;padding:11px;background:var(--red-bg);color:var(--red);border-radius:8px;font-size:13px;font-weight:600;border:1px solid rgba(192,48,48,.3)}

/* 📸 사진 입력 */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.photo-item{position:relative;aspect-ratio:1;background:var(--s2);border:1px solid var(--bdr);border-radius:8px;overflow:hidden}
.photo-item img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.photo-item .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.photo-add{aspect-ratio:1;background:var(--gold-bg);border:1.5px dashed var(--gold-line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--gold-lt);font-size:11px;font-weight:600;cursor:pointer}
.photo-add:active{background:var(--gold-line)}
.photo-add .ico{font-size:24px}

.toast{position:fixed;left:16px;right:16px;bottom:calc(80px + var(--safe-bot));background:var(--t1);color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;z-index:300;box-shadow:0 4px 16px rgba(0,0,0,.2);display:none;text-align:center;font-weight:500}
.toast.show{display:block;animation:toastIn .3s}
@keyframes toastIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast.success{background:var(--grn)}
.toast.error{background:var(--red)}
.toast.warn{background:var(--org)}
.toast.info{background:var(--blu)}

.search-wrap{margin-bottom:10px;position:relative}
.search-wrap input{width:100%;padding:10px 12px 10px 36px;background:var(--s1);border:1px solid var(--bdr);border-radius:8px;font-size:13.5px}
.search-wrap input:focus{outline:none;border-color:var(--gold-lt)}
.search-wrap::before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.5}

.seg{display:flex;background:var(--s2);border-radius:9px;padding:3px;margin-bottom:12px;gap:2px}
.seg button{flex:1;padding:9px 8px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--t2);transition:all .15s}
.seg button.active{background:var(--s1);color:var(--gold-lt);box-shadow:0 1px 4px rgba(0,0,0,.06)}

.empty{text-align:center;padding:40px 20px;color:var(--t3);font-size:13px}
.empty .icn{font-size:36px;margin-bottom:8px;opacity:.5}

.prod-item{padding:11px 14px;border-bottom:1px solid var(--bdr-lt);cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:background .15s}
.prod-item:active{background:var(--s2)}
.prod-item:last-child{border-bottom:none}
.prod-thumb{width:56px;height:56px;border-radius:7px;background:var(--s2);border:1px solid var(--bdr-lt);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--t3)}
.prod-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.prod-info{flex:1;min-width:0}
.prod-name{font-size:13.5px;font-weight:600;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod-meta{font-size:11px;color:var(--t3);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.prod-code{font-family:monospace;color:var(--gold-lt);font-weight:600;font-size:11px}
.prod-price{font-size:12.5px;font-weight:700;color:var(--gold-lt);font-family:'Cormorant Garamond',serif;letter-spacing:.3px;margin-top:4px}
.prod-stock{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:9px;background:var(--grn-bg);color:var(--grn);margin-left:6px}
.prod-stock.low{background:var(--org-bg);color:var(--org)}
.prod-stock.out{background:var(--red-bg);color:var(--red)}

.dt-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bdr-lt);gap:12px;font-size:12.5px}
.dt-row:last-child{border-bottom:none}
.dt-row .l{color:var(--t3);font-weight:500;flex-shrink:0}
.dt-row .v{color:var(--t1);font-weight:500;text-align:right;flex:1;word-break:break-word}

.act-row{display:flex;gap:8px;margin-top:14px}
.act-btn{flex:1;padding:10px;border-radius:7px;font-size:12.5px;font-weight:700;background:var(--s2);color:var(--t2);text-align:center}
.act-btn:active{transform:scale(.97)}
.act-btn.primary{background:var(--gold-lt);color:#fff}
.act-btn.success{background:var(--grn);color:#fff}
.act-btn.warn{background:var(--org);color:#fff}
.act-btn.danger{background:var(--red-bg);color:var(--red);border:1px solid rgba(192,48,48,.3)}

.io-item{padding:12px 14px;border-bottom:1px solid var(--bdr-lt);display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.io-item:active{background:var(--s2)}
.io-item:last-child{border-bottom:none}
.io-icn{width:38px;height:38px;border-radius:50%;background:var(--gold-bg);color:var(--gold-lt);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;font-weight:700}
.io-icn.recv{background:var(--blu-bg);color:var(--blu)}
.io-icn.ship{background:var(--org-bg);color:var(--org)}
.io-info{flex:1;min-width:0}
.io-title{font-size:13.5px;font-weight:600;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.io-meta{font-size:11px;color:var(--t3);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap}

.repair-row{display:grid;grid-template-columns:1fr 60px 80px 30px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bdr-lt)}
.repair-row input{padding:7px 8px;font-size:12px;border:1px solid var(--bdr);border-radius:5px;background:var(--s1)}
.repair-row .rm{background:none;color:var(--t3);font-size:16px;text-align:center}

/* 📝 업무일지 */
.task-row{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bdr-lt);align-items:flex-start;cursor:pointer}
.task-row:last-child{border-bottom:none}
.task-row:active{background:var(--s2)}
.task-cat{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:3px;flex-shrink:0;letter-spacing:.2px;align-self:flex-start;margin-top:2px}
.task-cat.bizu{background:var(--prp-bg);color:var(--prp)}
.task-cat.bord{background:var(--org-bg);color:var(--org)}
.task-cat.bsmp{background:var(--blu-bg);color:var(--blu)}
.task-cat.bship{background:var(--red-bg);color:var(--red)}
.task-cat.bcom{background:var(--grn-bg);color:var(--grn)}
.task-content{flex:1;min-width:0}
.task-content .ct{font-size:13.5px;font-weight:500;color:var(--t1);word-break:break-word;line-height:1.4}
.task-content .ct.done{text-decoration:line-through;color:var(--t3)}
.task-content .meta{font-size:11px;color:var(--t3);margin-top:2px}
.task-chk{width:22px;height:22px;border:1.5px solid var(--bdr);border-radius:5px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--s1);transition:all .15s;margin-top:1px}
.task-chk.done{background:var(--grn);border-color:var(--grn);color:#fff;font-size:14px}
.task-chk.auto{background:var(--gold-bg);border-color:var(--gold-line);color:var(--gold-lt);cursor:default}
.task-chk:active{transform:scale(.92)}

.notion-help{background:var(--gold-bg);border:1px solid var(--gold-line);padding:10px 12px;border-radius:7px;margin-bottom:14px;font-size:11.5px;color:var(--gold-lt);line-height:1.55}
.notion-help code{background:#fff;padding:1px 5px;border-radius:3px;font-family:monospace}

.spacer{height:14px}
.center{text-align:center}
.muted{color:var(--t3)}
.bold{font-weight:700}
</style>
</head>

<script>
// ════════════════════════════════════════════
// EK OEM Mobile · 데이터 모델 + 동기화 + 렌더링
// ════════════════════════════════════════════

const LS = {
  smp:'ek3_smp', ord:'ek3_ord', task:'ek3_task', cli:'ek_v9_cli',
  as:'ek3_as', io:'ek3_io', inv:'ek3_inv', prod:'ek3_prod',
  notion:'ek_notion_cfg', sh:'ek3_stock_hist'
};

let samples=[], orders=[], tasks=[], clients=[], asItems=[], ioItems=[], invoiceHistory=[], productDB=[], stockHistory=[], notionCfg=null;
let curPage='pgDash';
let _toastT=null;

// ────────────────────────────────────────
// 로컬 저장 / 로드
// ────────────────────────────────────────
function safeLoad(key, fallback){
  try{ const v=localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ console.warn('load failed:', key, e); return fallback; }
}
function safeSave(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }
  catch(e){ console.warn('save failed:', key, e); }
}
function loadAll(){
  samples       = safeLoad(LS.smp, []);
  orders        = safeLoad(LS.ord, []);
  tasks         = safeLoad(LS.task, []);
  clients       = safeLoad(LS.cli, []);
  asItems       = safeLoad(LS.as, []);
  ioItems       = safeLoad(LS.io, []);
  invoiceHistory= safeLoad(LS.inv, []);
  productDB     = safeLoad(LS.prod, []);
  stockHistory  = safeLoad(LS.sh, []);
  notionCfg     = safeLoad(LS.notion, null);
  // notionCfg가 있지만 ioDb가 비어 있으면 기본값 보충 (실제 노션 DB ID)
  if(notionCfg && !notionCfg.ioDb){
    notionCfg.ioDb = 'a6024595f92f4f039493e907492b8eef';
  }
}
function saveAll(){
  safeSave(LS.smp, samples);
  safeSave(LS.ord, orders);
  safeSave(LS.task, tasks);
  safeSave(LS.as, asItems);
  safeSave(LS.io, ioItems);
  safeSave(LS.inv, invoiceHistory);
  safeSave(LS.prod, productDB);

function pad2(n){ return n<10?'0'+n:''+n; }
function toLocalDateStr(d){
  if(!d) return '';
  const dt = d instanceof Date ? d : new Date(d);
  return dt.getFullYear()+'-'+pad2(dt.getMonth()+1)+'-'+pad2(dt.getDate());
}
function dday(due){
  if(!due) return null;
  const t=new Date(); t.setHours(0,0,0,0);
  const d=new Date(due); d.setHours(0,0,0,0);
  return Math.round((d-t)/(1000*60*60*24));
}
function ddayLabel(due){
  const d=dday(due);
  if(d===null) return null;
  if(d<0) return {cls:'dd-urg', t:`D+${-d}`};
  if(d===0) return {cls:'dd-urg', t:'D-0'};
  if(d<=3) return {cls:'dd-warn', t:`D-${d}`};
  return {cls:'dd-ok', t:`D-${d}`};
}
function strHash(s){let h=0;for(let i=0;i<s.length;i++)h=s.charCodeAt(i)+((h<<5)-h);return h;}
function strColor(s){
  const colors=['#8B6914','#1A6DB5','#A85A10','#5040A0','#2E8B2C','#C03030','#6B4E0A','#7C5500'];
  return colors[Math.abs(strHash(s||''))%colors.length];
}
// 고객사 이름 → 영문 2자 이니셜
// 우선순위:
// 1. clients DB에 등록된 영문 이니셜 (가장 정확)
// 2. 영문 이름이면 첫 글자 + 두번째 단어 첫 글자 (또는 첫 2자)
// 3. 한글이면 로마자 음역 (한글 자음 첫 자 매핑)
function getInitial(name){
  const nm=(name||'').trim();
  if(!nm) return '';
  // 1) 고객사 DB에서 매칭 (이름 또는 이니셜 자체로)
  const cl=clients.find(c=>{
    const cn=(c.name||'').trim();
    const ci=(c.initials||'').trim();
    return cn===nm || (cn && nm.includes(cn)) || ci.toUpperCase()===nm.toUpperCase();
  });
  if(cl&&cl.initials){
    const ini = cl.initials.trim().toUpperCase();
    // 영문/숫자만 추출 (한글 이니셜 방어)
    const eng = ini.replace(/[^A-Z0-9]/g,'');
    if(eng) return eng.slice(0,2);
  }
  // 2) 법인 표기 제거 후 시도
  const clean=nm.replace(/^\(.*?\)/,'').replace(/주식회사|㈜|\(주\)|유한회사|\(유\)/g,'').trim();
  // 3) 영문이 들어 있으면 영문만 추출
  const engChars=clean.match(/[A-Za-z]/g);
  if(engChars && engChars.length>=2){
    return (engChars[0]+engChars[1]).toUpperCase();
  }
  // 4) 한글 이름 → 로마자 첫 자음 매핑 (간단)
  return _hangulToInitial(clean);
}

// 한글 → 영문 2글자 이니셜 (자음 기준 음역, 매핑이 없으면 ASCII fallback)
function _hangulToInitial(s){
  if(!s) return '';
  // 초성(한글 자음) → 로마자
  const CHO_MAP = ['G','GG','N','D','DD','R','M','B','BB','S','SS','','J','JJ','C','K','T','P','H'];
  // 한글이 아니면 첫 2자 그대로
  const ch = [...s].filter(c=>c.trim());
  if(!ch.length) return '';
  const getInitialOf = (c)=>{
    const code = c.charCodeAt(0);
    // 한글 음절 (가-힣)
    if(code>=0xAC00 && code<=0xD7A3){
      const cho = Math.floor((code-0xAC00)/588);
      return CHO_MAP[cho] || c;
    }
    // 영문/숫자
    if(/[A-Za-z0-9]/.test(c)) return c.toUpperCase();
    return '';
  };
  // 첫 음절 + 두번째 단어 첫 음절 (단어 = 공백 구분)
  const words = s.split(/\s+/).filter(Boolean);
  if(words.length>=2){
    const a = getInitialOf(words[0][0]);
    const b = getInitialOf(words[1][0]);
    if(a && b) return (a[0]+b[0]).toUpperCase();
  }
  // 단일 단어 → 첫 2 음절의 초성 (각 첫 자)
  const i1 = getInitialOf(ch[0]||'');
  const i2 = getInitialOf(ch[1]||'');
  const result = (i1[0]||'') + (i2[0]||'');
  return result ? result.toUpperCase() : ch.slice(0,2).join('').toUpperCase();
}
function initBadge(name){
  const nm=(name||'').trim();
  if(!nm) return '';
  return `<span class="li-init" style="background:${strColor(nm)}">${getInitial(nm)}</span>`;
}

// 고객사명을 영문 이니셜로 표시 — 모바일 좁은 화면 최적화
// 옵션:
//   {fallback:'-'}: 이니셜을 못 만든 경우 표시할 텍스트
//   {showFullIfNoInit:true}: 이니셜 못 만들면 원래 이름 표시
function vendorDisplay(name, opts){
  opts = opts || {};
  const init = getInitial(name);
  if(init) return init;
  if(opts.showFullIfNoInit) return (name||'').trim() || (opts.fallback || '-');
  return opts.fallback || '-';
}
function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function parseQty(v){
  if(!v) return 0;
  const m=String(v).match(/[\d,]+/);
  return m ? parseInt(m[0].replace(/,/g,''))||0 : 0;
}
function showToast(msg, kind){

// 노션 동기화 (PC와 동일 프록시 사용)
// ────────────────────────────────────────
async function notionProxy(path, opts){
  if(!notionCfg||!notionCfg.workerUrl) return null;
  const headers = {'Content-Type':'application/json'};
  if(notionCfg.token) headers['Authorization'] = 'Bearer '+notionCfg.token;
  const route = notionCfg.workerUrl.replace(/\/+$/,'') + (path.startsWith('/notion')?path:'/notion'+path);
  const r = await fetch(route, {...opts, headers:{...headers,...((opts&&opts.headers)||{})}});
  return r.json();
}

async function nQueryAll(dbId){
  if(!notionCfg||!notionCfg.workerUrl||!dbId) return [];
  let all=[], cursor=null;
  for(let i=0;i<60;i++){
    const body={page_size:100};
    if(cursor) body.start_cursor=cursor;
    const res = await notionProxy(`/databases/${dbId}/query`, {method:'POST', body:JSON.stringify(body)});
    if(!res || res.error){ console.warn('nQuery 실패:', res); break; }
    all = all.concat(res.results||[]);
    if(!res.has_more) break;
    cursor = res.next_cursor;
  }
  return all;
}

async function nCreate(dbId, properties){
  return notionProxy('/pages', {method:'POST', body:JSON.stringify({parent:{database_id:dbId}, properties})});
}
async function nUpdate(pageId, properties){
  return notionProxy(`/pages/${pageId}`, {method:'PATCH', body:JSON.stringify({properties})});
}

function mapNotionOrder(row){
  const p=row.properties||{};
  // 우선 품목상세JSON에서 완전 복원 시도
  let rows=[];
  const rowsJson = np.text(p['품목상세JSON']);
  if(rowsJson){
    try{
      const parsed = JSON.parse(rowsJson);
      if(Array.isArray(parsed)) rows = parsed;
    }catch(e){}
  }
  // 폴백: 품목목록 텍스트에서 기본 rows 복원 ("A ×3, B ×2")
  if(!rows.length){
    const itemStr = np.text(p['품목목록']);
    if(itemStr){
      rows = itemStr.split(',').map(s=>{
        const m = s.trim().match(/^(.+?)\s*×\s*(\d+)$/);
        return m ? {name:m[1].trim(), qty:m[2], plating:'실버', mat:'브라스 (BRASS)', size:'', note:''} : null;
      }).filter(Boolean);
    }
  }
  // 첨부파일 JSON 복원
  let files = [];
  const filesJson = np.text(p['첨부파일JSON']);
  if(filesJson){
    try{
      const parsed = JSON.parse(filesJson);
      if(Array.isArray(parsed)) files = parsed;
    }catch(e){}
  }
  // 메모에서 memoList 파싱 (JSON:: prefix면 체크리스트)
  const memoText = np.text(p['메모']) || '';
  let memoList = [];
  let legacyMemo = memoText;
  if(memoText.startsWith('JSON::')){
    try{
      const parsed = JSON.parse(memoText.slice(6));
      if(Array.isArray(parsed)){
        memoList = parsed.map(m=>({text:String(m.text||''), checked:!!m.checked}));
        legacyMemo = '';
      }
    }catch(e){}
  }
  return {
    _notionId:row.id,
    no:      np.title(p['발주번호']),  // title 필드 ← 발주번호
    vendor:  np.text(p['업체명']),     // text 필드 ← 업체명
    manager: np.text(p['담당자']),
    memo:    legacyMemo,
    memoList,
    rows,
    files,
    date:    np.date(p['발주일']),
    ship:    np.date(p['요청출고일']),
    factShip:np.date(p['공장출고일']),
    factoryNotice: np.text(p['공장주의사항']) || '',
    status:  np.select(p['상태']) || '진행중',

    issuedAt:  np.date(p['발행일']),
    shipDate:  np.date(p['출고일자']),
    supplyAmt: np.number(p['공급가액']),
    tax:       np.number(p['부가세']),
    total:     np.number(p['합계']),
    status:    np.select(p['상태'])||'발행완료',
    memo:      np.text(p['메모']),
    items,
    itemSummary: np.text(p['품목요약'])
  };
}

function mapNotionTask(row){
  const p=row.properties||{};
  return {
    _notionId:row.id,
    cont:np.title(p['내용']),
    date:np.date(p['날짜']),
    ap:np.select(p['시간대'])||'',
    cat:np.select(p['카테고리'])||'업무',
    note:np.text(p['비고']),
    done:!!(p['완료']?.checkbox)
  };
}

function mapNotionClient(row){
  const p=row.properties||{};
  return {
    _notionId:row.id,
    name:    np.title(p['업체명']),
    initials:np.text(p['이니셜']),
    contact: np.text(p['담당자']),
    tel:     np.text(p['연락처']),
    email:   np.text(p['이메일'])
  };
}

// ════════════════════════════════════════════
// 🔔 알림 시스템
// ════════════════════════════════════════════
// 동기화 직전 데이터와 동기화 후 데이터 차이를 비교해서 알림 생성
// 알림은 localStorage('ek3_notifs')에 저장 (최대 50개)
// 각 알림: {id, ts, ico, msg, kind, targetId, read}
//   - kind: 'order'|'sample'|'as'|'io'|'invoice'|'orderStatus'
//   - targetId: 클릭 시 이동할 항목 id
const LS_NOTIF = 'ek3_notifs';
const NOTIF_MAX = 50;
let _notifs = [];
let _notifPanelOpen = false;

function _loadNotifs(){
  try {
    const raw = localStorage.getItem(LS_NOTIF);
    _notifs = raw ? JSON.parse(raw) : [];
  } catch(e){ _notifs = []; }
}
function _saveNotifs(){
  try {
    // 오래된 것부터 잘라서 최대 50개 유지
    if(_notifs.length > NOTIF_MAX) _notifs = _notifs.slice(-NOTIF_MAX);
    localStorage.setItem(LS_NOTIF, JSON.stringify(_notifs));
  } catch(e){ console.warn('알림 저장 실패:', e); }
}
function _addNotif(notif){
  notif.id = Date.now() + Math.random();
  notif.ts = Date.now();
  notif.read = false;
  _notifs.push(notif);
}

// 동기화 전후의 데이터 비교 → 알림 생성
// prev/curr는 노션 ID(_notionId)를 키로 사용 (안정적 식별자)
function _detectChanges(prev, curr){
  if(!prev || !prev.length) return; // 첫 동기화는 알림 생성 안 함
  const newItems = [];
  // 발주서 신규
  const prevOrdIds = new Set((prev.orders||[]).map(o=>o._notionId).filter(Boolean));
  (curr.orders||[]).forEach(o=>{
    if(o._notionId && !prevOrdIds.has(o._notionId)){
      _addNotif({
        ico:'📋', kind:'order', targetId:o.id,
        msg:`새 발주: ${o.vendor||'(이름없음)'} · ${o.no||'-'}`
      });
    }
  });
  // 발주 상태 변경 (출고완료/취소 등)
  const prevOrdMap = new Map((prev.orders||[]).filter(o=>o._notionId).map(o=>[o._notionId, o]));
  (curr.orders||[]).forEach(o=>{
    if(!o._notionId) return;
    const old = prevOrdMap.get(o._notionId);
    if(!old) return;
    if(old.status !== o.status && o.status){
      // 의미 있는 변화만 알림 (진행중 → 다른 상태)
      if(o.status === '출고완료' || o.status === '취소' || o.status === '보류'){
        _addNotif({
          ico: o.status === '출고완료' ? '✅' : (o.status === '취소' ? '✕' : '⏸'),
          kind:'orderStatus', targetId:o.id,
          msg:`${o.vendor||''} 발주가 ${o.status}로 변경됨`
        });
      }
    }
  });
  // 샘플 신규
  const prevSmpIds = new Set((prev.samples||[]).map(s=>s._notionId).filter(Boolean));
  (curr.samples||[]).forEach(s=>{
    if(s._notionId && !prevSmpIds.has(s._notionId)){
      _addNotif({
        ico:'💎', kind:'sample', targetId:s.id,
        msg:`새 샘플: ${s.name||'(이름없음)'}${s.manager?` · ${s.manager}`:''}`
      });
    }
  });
  // AS 신규
  const prevAsIds = new Set((prev.asItems||[]).map(a=>a._notionId).filter(Boolean));
  (curr.asItems||[]).forEach(a=>{
    if(a._notionId && !prevAsIds.has(a._notionId)){
      _addNotif({
        ico:'🔧', kind:'as', targetId:a.id,
        msg:`새 AS: ${a.item||'(품목없음)'}${a.client?` · ${a.client}`:''}`
      });
    }
  });
  // 입출고 신규
  const prevIoIds = new Set((prev.ioItems||[]).map(x=>x._notionId).filter(Boolean));
  (curr.ioItems||[]).forEach(io=>{
    if(io._notionId && !prevIoIds.has(io._notionId)){
      const icon = io.kind === '출고' ? '📤' : '📥';
      _addNotif({
        ico:icon, kind:'io', targetId:io.id,
        msg:`새 ${io.kind||'입출고'}: ${io.title||io.vendor||'-'}`
      });
    }
  });
  // 거래명세서 신규
  const prevInvIds = new Set((prev.invoiceHistory||[]).map(v=>v._notionId).filter(Boolean));
  (curr.invoiceHistory||[]).forEach(v=>{
    if(v._notionId && !prevInvIds.has(v._notionId)){
      _addNotif({
        ico:'🧾', kind:'invoice', targetId:v.id,
        msg:`새 거래명세서: ${v.vendor||'-'} · ${(+v.total||0).toLocaleString()}원`
      });
    }
  });
  if(_notifs.length){
    _saveNotifs();
    _renderNotifBadge();
    if(_notifPanelOpen) _renderNotifPanel();
  }
}

function _renderNotifBadge(){
  const btn = document.getElementById('notifBtn');
  const cnt = document.getElementById('notifCnt');
  if(!btn || !cnt) return;
  const unread = _notifs.filter(n => !n.read).length;
  if(unread > 0){
    cnt.textContent = unread > 99 ? '99+' : unread;
    cnt.style.display = 'flex';
    btn.classList.add('has-unread');
  } else {
    cnt.style.display = 'none';
    btn.classList.remove('has-unread');
  }
}

function toggleNotifPanel(){
  _notifPanelOpen = !_notifPanelOpen;
  const panel = document.getElementById('notifPanel');
  if(!panel) return;
  panel.style.display = _notifPanelOpen ? 'flex' : 'none';
  if(_notifPanelOpen) _renderNotifPanel();
}

function _renderNotifPanel(){
  const body = document.getElementById('notifPanelBody');
  const cntEl = document.getElementById('notifPanelCnt');
  if(!body) return;
  // 최신순 정렬
  const list = [..._notifs].sort((a,b)=>b.ts - a.ts);
  const unread = list.filter(n => !n.read).length;
  if(cntEl) cntEl.textContent = unread > 0 ? `(읽지 않음 ${unread})` : '';
  if(!list.length){
    body.innerHTML = `<div class="notif-empty"><div style="font-size:32px;margin-bottom:8px">🔕</div>알림이 없습니다</div>`;
    return;
  }
  body.innerHTML = list.map(n=>`
    <div class="notif-item ${n.read?'':'unread'}" onclick="_openNotif(${JSON.stringify(n.id).replace(/"/g,'&quot;')})">
      <span class="ico">${n.ico||'🔔'}</span>
      <div class="body">
        <div class="msg">${escapeHtml(n.msg||'')}</div>
        <div class="time">${_relTime(n.ts)}</div>
      </div>
    </div>
  `).join('');
}

function _relTime(ts){
  const elapsed = Math.floor((Date.now() - ts) / 1000);
  if(elapsed < 60) return '방금';
  if(elapsed < 3600) return Math.floor(elapsed/60) + '분 전';
  if(elapsed < 86400) return Math.floor(elapsed/3600) + '시간 전';
  if(elapsed < 7*86400) return Math.floor(elapsed/86400) + '일 전';
  // 일주일 이상: 날짜 표시
  const d = new Date(ts);
  return `${(d.getMonth()+1)}/${d.getDate()}`;
}

function _openNotif(id){
  const n = _notifs.find(x=>x.id===id);
  if(!n) return;
  n.read = true;
  _saveNotifs();
  _renderNotifBadge();
  // 패널 닫기
  toggleNotifPanel();
  // 해당 항목으로 이동
  setTimeout(()=>{
    if(n.kind === 'order' || n.kind === 'orderStatus'){
      showOrdDetail(n.targetId);
    } else if(n.kind === 'sample'){
      showSmpDetail(n.targetId);
    } else if(n.kind === 'as'){
      // AS 상세는 더보기 → AS 탭에서
      goPage('pgMore');
      setTimeout(()=>{
        setMoreTab('as');
        setTimeout(()=>showAsDetail(n.targetId), 100);
      }, 100);
    } else if(n.kind === 'io'){
      showIoDetail(n.targetId);
    } else if(n.kind === 'invoice'){
      goPage('pgMore');
      setTimeout(()=>{
        setMoreTab('inv');
        setTimeout(()=>showInvDetail(n.targetId), 100);
      }, 100);
    }
  }, 100);
}

function markAllNotifRead(){
  _notifs.forEach(n => n.read = true);
  _saveNotifs();
  _renderNotifBadge();
  _renderNotifPanel();
}

// 알림 패널 외부 탭 시 닫기
document.addEventListener('click', (e)=>{
  if(!_notifPanelOpen) return;
  const panel = document.getElementById('notifPanel');
  const btn = document.getElementById('notifBtn');
  if(!panel || !btn) return;
  if(panel.contains(e.target) || btn.contains(e.target)) return;
  toggleNotifPanel();
}, true);

// ──── 동기화 (풀) ────
// 마지막 동기화 시각 추적 (자동 동기화 간격 제어 + UI 표시용)
let _lastSyncAt = 0;
let _syncInProgress = false;

async function manualSync(silent){
  // silent=true: 백그라운드 자동 동기화 (토스트/버튼 변화 최소화)
  // silent=false 또는 undefined: 사용자가 동기화 버튼 누른 것
  if(_syncInProgress) return; // 중복 실행 방지
  if(!notionCfg || !notionCfg.workerUrl){
    if(!silent){
      showToast('Notion 설정이 필요합니다','warn');
      setTimeout(openNotionSettings, 700);
    }
    return;
  }
  _syncInProgress = true;
  const btn = document.getElementById('syncBtn');
  const lbl = document.getElementById('syncLabel');
  if(btn) btn.classList.add('syncing');
  if(lbl && !silent) lbl.textContent = '동기화 중...';

  // 동기화 전 데이터 스냅샷 (변경 감지용)
  const prev = {
    orders: [...orders],
    samples: [...samples],
    asItems: [...asItems],
    ioItems: [...ioItems],
    invoiceHistory: [...invoiceHistory]
  };

  try{
    const [smpRows, ordRows, asRows, ioRows, pdRows, invRows, taskRows, cliRows] = await Promise.all([
      notionCfg.smpDb     ? nQueryAll(notionCfg.smpDb)     : Promise.resolve([]),
      notionCfg.ordDb     ? nQueryAll(notionCfg.ordDb)     : Promise.resolve([]),
      notionCfg.asDb      ? nQueryAll(notionCfg.asDb)      : Promise.resolve([]),
      notionCfg.ioDb      ? nQueryAll(notionCfg.ioDb)      : Promise.resolve([]),
      notionCfg.productDb ? nQueryAll(notionCfg.productDb) : Promise.resolve([]),
      notionCfg.invDb     ? nQueryAll(notionCfg.invDb)     : Promise.resolve([]),
      notionCfg.taskDb    ? nQueryAll(notionCfg.taskDb)    : Promise.resolve([]),
      notionCfg.clientDb  ? nQueryAll(notionCfg.clientDb)  : Promise.resolve([])
    ]);
    samples       = smpRows.map(mapNotionSample).map((s,i)=>({id:Date.now()+i,...s}));
    orders        = ordRows.map(mapNotionOrder).map((o,i)=>({id:Date.now()+1000+i,...o}));
    asItems       = asRows.map(mapNotionAS).map((a,i)=>({id:Date.now()+2000+i,...a}));
    ioItems       = ioRows.map(mapNotionIO).map((x,i)=>({id:Date.now()+3000+i,...x}));
    productDB     = pdRows.map(mapNotionProduct).map((p,i)=>({id:Date.now()+4000+i,...p}));
    invoiceHistory= invRows.map(mapNotionInvoice).map((v,i)=>({id:Date.now()+5000+i,...v}));
    tasks         = taskRows.map(mapNotionTask).map((t,i)=>({id:Date.now()+6000+i,...t}));
    clients       = cliRows.map(mapNotionClient).map((c,i)=>({id:Date.now()+7000+i,...c}));
    saveAll();
    _lastSyncAt = Date.now();
    _updateSyncLabel();

    // 🔔 변경 감지 → 알림 생성 (첫 동기화는 prev가 비어있어서 자동 스킵)
    _detectChanges({
      orders: prev.orders,
      samples: prev.samples,
      asItems: prev.asItems,
      ioItems: prev.ioItems,
      invoiceHistory: prev.invoiceHistory
    }, {orders, samples, asItems, ioItems, invoiceHistory});

    if(!silent){
      showToast(`✓ 동기화 완료 — 발주 ${orders.length} · 샘플 ${samples.length} · 입출고 ${ioItems.length}`, 'success');
    }
    goPage(curPage); // 재렌더
  }catch(e){
    console.error(e);
    if(!silent){
      showToast('동기화 실패: '+e.message, 'error');
      if(lbl) lbl.textContent = '동기화';
    } else {
      // silent 실패 시 라벨에 슬쩍 표시
      if(lbl) lbl.textContent = '동기화 실패';
    }
  }finally{
    if(btn) btn.classList.remove('syncing');
    _syncInProgress = false;
  }
}

// 동기화 라벨 업데이트 ("3초 전", "5분 전" 등)
function _updateSyncLabel(){
  const lbl = document.getElementById('syncLabel');
  if(!lbl) return;
  if(!_lastSyncAt){ lbl.textContent = '동기화'; return; }
  const elapsed = Math.floor((Date.now() - _lastSyncAt) / 1000);
  let txt;
  if(elapsed < 5) txt = '방금';
  else if(elapsed < 60) txt = elapsed + '초 전';
  else if(elapsed < 3600) txt = Math.floor(elapsed/60) + '분 전';
  else txt = Math.floor(elapsed/3600) + '시간 전';
  lbl.textContent = txt;
}

// ──── 자동 동기화 ────
// 다음 시나리오에서 자동으로 노션에서 가져옴 (silent 모드):
//   1. 앱 시작 시 (window.onload)
//   2. 주기적 (30초마다)
//   3. 탭/페이지 변경 시 (30초 이상 지났을 때)
//   4. 포커스 복귀 시 (다른 앱 갔다 돌아옴, 10초 이상 지났을 때)
const _AUTO_SYNC_INTERVAL = 30000; // 30초
const _FOCUS_SYNC_MIN_INTERVAL = 10000; // 10초

async function autoSync(minIntervalMs){
  // minIntervalMs가 주어졌으면, 마지막 동기화로부터 그만큼 안 지났으면 스킵
  if(minIntervalMs && _lastSyncAt && (Date.now() - _lastSyncAt) < minIntervalMs) return;
  if(!notionCfg || !notionCfg.workerUrl) return;
  if(document.hidden) return; // 백그라운드일 땐 동기화 안 함 (배터리 절약)
  await manualSync(true);
}

function setupAutoSync(){
  // 30초마다 주기 동기화
  setInterval(()=>{
    autoSync(_AUTO_SYNC_INTERVAL - 1000); // 30초 약간 안 됐을 때도 OK
    _updateSyncLabel(); // 라벨도 매번 갱신
  }, _AUTO_SYNC_INTERVAL);

  // 라벨은 더 자주 업데이트 (1초마다, "방금" → "5초 전" 자연스럽게)
  setInterval(_updateSyncLabel, 1000);

  // 페이지 가시성 변경 (다른 탭/앱 갔다 돌아옴)
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden){
      // 돌아왔을 때 10초 이상 지났으면 동기화
      autoSync(_FOCUS_SYNC_MIN_INTERVAL);
    }
  });

  // 윈도우 포커스 (iOS Safari는 visibilitychange가 항상 발화 안 할 수 있음 — 백업)
  window.addEventListener('focus', ()=>{
    autoSync(_FOCUS_SYNC_MIN_INTERVAL);
  });

  // 네트워크 복구 (오프라인 → 온라인)
  window.addEventListener('online', ()=>{
    showToast('🔌 온라인 복귀 · 동기화 중...', 'info', 2000);
    setTimeout(()=>autoSync(0), 500); // 강제 동기화
  });
}

// ────────────────────────────────────────
// 노션 설정 모달
// ────────────────────────────────────────
function openNotionSettings(){
  const cur = notionCfg ? JSON.stringify(notionCfg, null, 2) : '';
  const status = notionCfg ? `<div style="padding:10px 12px;background:var(--grn-bg);border:1px solid rgba(46,139,44,.3);border-radius:7px;font-size:11.5px;color:var(--grn);margin-bottom:14px"><b>✓ 연결됨</b> · ${notionCfg.workerUrl||''}</div>` : `<div style="padding:10px 12px;background:var(--red-bg);border:1px solid rgba(192,48,48,.3);border-radius:7px;font-size:11.5px;color:var(--red);margin-bottom:14px"><b>⚠ 미연결</b> · 아래에 설정을 붙여넣으세요</div>`;
  const body = `
    ${status}
    <div class="notion-help">
      <b>📋 PC에서 설정 가져오는 법</b><br>
      1. PC에서 F12 → Console 탭<br>
      2. 입력: <code>copy(localStorage.getItem('ek_notion_cfg'))</code><br>
      3. 엔터 → 자동 클립보드 복사<br>
      4. 폰으로 메시지/노트 보내기 → 아래에 붙여넣기
    </div>
    <div class="form-r">
      <label>설정 JSON</label>
      <textarea id="notionCfgInput" style="min-height:180px;font-family:monospace;font-size:11px" placeholder='{"workerUrl":"https://...","smpDb":"...","ordDb":"...","asDb":"...","ioDb":"...","productDb":"...","invDb":"...","taskDb":"...","clientDb":"..."}'>${cur}</textarea>
    </div>
    <button class="btn-primary" onclick="saveNotionCfgFromInput()">저장 + 동기화</button>
    <div class="spacer"></div>
    <button class="btn-danger" onclick="clearNotionCfg()">설정 삭제</button>
  `;
  openModal('⚙ Notion 동기화 설정', body);
}

function saveNotionCfgFromInput(){
  const txt = document.getElementById('notionCfgInput').value.trim();
  if(!txt){ showToast('JSON을 입력하세요','warn'); return; }
  try{
    const cfg = JSON.parse(txt);
    if(!cfg.workerUrl) throw new Error('workerUrl이 필요합니다');
    notionCfg = cfg;
    safeSave(LS.notion, notionCfg);
    closeModal();
    showToast('✓ 저장됨 — 동기화 시작', 'success');
    setTimeout(manualSync, 300);
  }catch(e){
    showToast('JSON 형식 오류: '+e.message, 'error');
  }
}

function clearNotionCfg(){
  if(!confirm('Notion 설정을 삭제할까요?')) return;
  localStorage.removeItem(LS.notion);
  notionCfg = null;
  closeModal();
  showToast('설정 삭제됨', 'info');
}

</script>
<script>
// ════════════════════════════════════════════
// 렌더링 (대시보드, 발주, 샘플, 입출고, 더보기)
// ════════════════════════════════════════════

// ──── 대시보드 ────
let calCur = new Date(); calCur.setDate(1);

function renderDash(){
  const ordIp = orders.filter(o=>{
    const st=o.status||'진행중';
    return st!=='출고완료' && st!=='취소' && st!=='보류';
  }).length;
  const smpIp = samples.filter(s=>{
    const st=s.status||'의뢰';
    return st!=='완료' && st!=='확정' && st!=='취소';
  }).length;
  const today = toLocalDateStr(new Date());
  let urg=0;
  orders.forEach(o=>{
    const st=o.status||'진행중';
    if(st==='출고완료'||st==='취소'||st==='보류') return;
    const dd=dday(o.ship);
    if(dd!==null && dd>=0 && dd<=3) urg++;
  });
  samples.forEach(s=>{
    const st=s.status||'의뢰';
    if(st==='완료'||st==='확정'||st==='취소') return;
    const dd=dday(s.due);
    if(dd!==null && dd>=0 && dd<=3) urg++;
  });
  let tod=0;
  orders.forEach(o=>{ if(o.ship===today) tod++; });
  samples.forEach(s=>{ if(s.due===today) tod++; });
  tasks.forEach(t=>{ if(t.date===today) tod++; });
  ioItems.forEach(io=>{ if(io.date===today) tod++; });

  document.getElementById('kpiOrd').innerHTML = `${ordIp}<small>건</small>`;
  document.getElementById('kpiSmp').innerHTML = `${smpIp}<small>건</small>`;
  document.getElementById('kpiUrg').innerHTML = `${urg}<small>건</small>`;
  document.getElementById('kpiTod').innerHTML = `${tod}<small>건</small>`;

  // 재고 부족 배너
  const lowBanner = document.getElementById('lowStockBanner');
  if(lowBanner){
    const low = productDB.filter(p=>{
      const stock=+p.stock||0, safety=+p.safetyStock||0;
      return safety>0 && stock<=safety;
    }).sort((a,b)=>(+a.stock||0)/(+a.safetyStock||1) - (+b.stock||0)/(+b.safetyStock||1));
    if(low.length){
      const top = low.slice(0,3);
      const rest = low.length>3 ? ` 외 ${low.length-3}건` : '';
      lowBanner.innerHTML = `<div onclick="goPage('pgMore');setTimeout(()=>setMoreTab('prod'),50)" style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--org-bg);border:1px solid rgba(168,90,16,.3);border-radius:8px;font-size:11.5px;margin-bottom:8px;cursor:pointer">
        <span style="color:var(--org);font-weight:700;flex-shrink:0">⚠ 재고부족 ${low.length}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t2)">${top.map(p=>`<b style="color:var(--t1)">${escapeHtml(p.name||p.code)}</b> <span style="color:var(--t3)">${(+p.stock||0)}/${(+p.safetyStock||0)}</span>`).join(' · ')}${rest}</span>
        <span style="color:var(--org);font-size:10.5px;flex-shrink:0;font-weight:600">→</span>
      </div>`;
    } else {
      lowBanner.innerHTML = '';
    }
  }
  renderCal();
  renderTaskDay();  // 📝 업무일지
}

let _taskDay = toLocalDateStr(new Date());

function taskDayMove(delta){
  const d = new Date(_taskDay);
  d.setDate(d.getDate() + delta);
  _taskDay = toLocalDateStr(d);
  renderTaskDay();
}
function taskDayToday(){
  _taskDay = toLocalDateStr(new Date());
  renderTaskDay();
}
function taskDayPickDate(){
  // 임시 input 만들어 클릭
  const inp = document.createElement('input');
  inp.type = 'date';
  inp.value = _taskDay;
  inp.style.position = 'fixed';
  inp.style.top = '-100px';
  document.body.appendChild(inp);
  inp.onchange = ()=>{
    if(inp.value){ _taskDay = inp.value; renderTaskDay(); }
    document.body.removeChild(inp);
  };
  inp.click();
  // 일부 브라우저는 onchange 없이 닫힘 — 5초 후 cleanup
  setTimeout(()=>{ if(document.body.contains(inp)) document.body.removeChild(inp); }, 5000);
}

// 자동 항목 — 그날의 발주 출고/샘플 납기 (PC와 유사한 패턴)
function getAutoTasks(ds){
  const items = [];
  // 발주 출고일
  orders.filter(o => o.ship === ds).forEach(o => {
    const st = o.status || '진행중';
    const isDone = st === '출고완료' || st === '취소';
    const doneReason = st === '출고완료' ? '출고완료' : (st === '취소' ? '취소' : '');
    (o.rows||[]).forEach((r,i) => {
      // 의미 있는 내용이 없으면(업체명도, 품목명도 비어있으면) 항목 자체를 만들지 않음
      const vendor = (o.vendor||'').trim();
      const itemName = (r.name||'').trim();
      if(!vendor && !itemName) return;
      const qtyStr = parseQty(r.qty) ? ` ×${parseQty(r.qty)}` : '';
      const cont = vendor && itemName ? `${vendor} - ${itemName}${qtyStr}` :
                   itemName ? `${itemName}${qtyStr}` :
                   `${vendor}${qtyStr}`;
      items.push({
        auto: true,
        id: 'ord_' + o.id + '_' + i,
        cat: '발주출고',
        cont,
        done: isDone,
        doneReason,
        click: 'showOrdDetail(' + o.id + ')'
      });
    });
    if(!(o.rows||[]).length){
      const vendor = (o.vendor||'').trim();
      if(!vendor) return; // 업체명도 없는 빈 발주서는 표시 안 함
      items.push({
        auto: true,
        id: 'ord_' + o.id,
        cat: '발주출고',
        cont: vendor,
        done: isDone,
        doneReason,
        click: 'showOrdDetail(' + o.id + ')'
      });
    }
  });
  // 샘플 납기일
  samples.filter(s => s.due === ds).forEach(s => {
    const st = s.status || '의뢰';
    const isDone = st === '완료' || st === '확정' || st === '취소';
    const doneReason = isDone ? st : '';
    const manager = (s.manager||'').trim();
    const name = (s.name||'').trim();
    if(!manager && !name) return; // 둘 다 비어있으면 스킵
    const cont = manager && name ? `${manager} - ${name}` :
                 name ? name : manager;
    items.push({
      auto: true,
      id: 'smp_' + s.id,
      cat: '샘플출고',
      cont,
      done: isDone,
      doneReason,
      click: 'showSmpDetail(' + s.id + ')'
    });
  });
  // 입출고 — 중국 입출고만 자동 표시
  ioItems.filter(io => io.date === ds && (io.flow === '중국→한국' || io.flow === '한국→중국')).forEach(io => {
    const cont = (io.title||'').trim() || (io.vendor||'').trim();
    if(!cont) return; // 제목도 업체도 없으면 스킵
    items.push({
      auto: true,
      id: 'io_' + io.id,
      cat: io.flow === '중국→한국' ? '중국입고' : '중국출고',
      cont,
      done: false,
      click: 'showIoDetail(' + io.id + ')'
    });
  });
  return items;
}

function renderTaskDay(){
  const lbl = document.getElementById('taskDayLbl');
  if(!lbl) return;
  const dt = new Date(_taskDay);
  const dows = ['일','월','화','수','목','금','토'];
  const today = toLocalDateStr(new Date());
  const isToday = _taskDay === today;
  const isHoliday = KR_HOLIDAYS[_taskDay];
  const dowCls = dt.getDay() === 0 || isHoliday ? 'color:var(--red)' : (dt.getDay() === 6 ? 'color:var(--blu)' : '');
  lbl.innerHTML = `<span style="${dowCls}">${pad2(dt.getMonth()+1)}.${pad2(dt.getDate())} (${dows[dt.getDay()]})</span>${isToday?'<span style="color:var(--gold-lt);font-size:10.5px;font-weight:600;margin-left:6px;font-family:\'Noto Sans KR\'">오늘</span>':''}${isHoliday?`<span style="color:var(--red);font-size:10.5px;font-weight:600;margin-left:6px;font-family:'Noto Sans KR'">${isHoliday}</span>`:''}`;

  const list = document.getElementById('taskDayList');
  const auto = getAutoTasks(_taskDay);
  const manual = tasks.filter(t => t.date === _taskDay);
  const all = [...auto, ...manual];

  if(!all.length){
    list.innerHTML = `<div class="empty" style="padding:24px 14px"><div class="icn" style="font-size:30px">📭</div><div style="font-size:12px">이 날짜에는 업무가 없습니다</div></div>`;
    return;
  }

  // 카테고리 정의 — 순서 + 색상 + 아이콘
  const CAT_DEFS = [
    {cat:'업무',     ico:'📋', color:'var(--prp)', bg:'var(--prp-bg)'},
    {cat:'커머스',   ico:'🛍', color:'var(--grn)', bg:'var(--grn-bg)'},
    {cat:'발주출고', ico:'📦', color:'var(--org)', bg:'var(--org-bg)'},
    {cat:'샘플출고', ico:'💎', color:'var(--blu)', bg:'var(--blu-bg)'},
    {cat:'중국입고', ico:'🇨🇳', color:'var(--red)', bg:'var(--red-bg)'},
    {cat:'중국출고', ico:'🇰🇷', color:'var(--red)', bg:'var(--red-bg)'}
  ];

  // 카테고리별 그룹화 (빈 내용 항목은 제외)
  const grouped = {};
  CAT_DEFS.forEach(d => { grouped[d.cat] = []; });
  all.forEach(t => {
    // 빈 내용 항목은 표시하지 않음 (자동·수동 모두)
    if(!(t.cont||'').trim()) return;
    const cat = t.cat || '업무';
    if(grouped[cat]) grouped[cat].push(t);
    else grouped['업무'].push(t); // 미지정은 업무로
  });

  // 카테고리별 섹션 렌더
  let html = '';
  CAT_DEFS.forEach(d => {
    const items = grouped[d.cat];
    if(!items.length) return; // 빈 섹션은 숨김

    // 섹션 헤더
    const doneCount = items.filter(t => t.done).length;
    html += `<div style="background:${d.bg};border-left:3px solid ${d.color};padding:8px 14px;display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:13px">${d.ico}</span>
        <span style="font-size:12px;font-weight:700;color:${d.color}">${d.cat}</span>
        <span style="font-size:10.5px;color:var(--t3);font-weight:500">${doneCount}/${items.length}</span>
      </div>
    </div>`;

    // 섹션 아이템들
    html += items.map(t => {
      if(t.auto){
        const checkClass = t.done ? 'done' : 'auto';
        const checkContent = t.done ? '✓' : '○';
        return `<div class="task-row" onclick="${t.click}" style="padding-left:22px">
          <div class="task-chk ${checkClass}" title="${escapeHtml(t.doneReason||'')}">${checkContent}</div>
          <div class="task-content">
            <div class="ct${t.done?' done':''}">${escapeHtml(t.cont)}</div>
            ${t.doneReason ? `<div class="meta">${escapeHtml(t.doneReason)}</div>` : ''}
          </div>
        </div>`;
      } else {
        return `<div class="task-row" style="padding-left:22px">
          <div class="task-chk ${t.done?'done':''}" onclick="event.stopPropagation();toggleTask(${t.id})">${t.done?'✓':''}</div>
          <div class="task-content" onclick="openTaskEdit(${t.id})">
            <div class="ct${t.done?' done':''}">${escapeHtml(t.cont||'')}</div>
            ${t.note ? `<div class="meta">${escapeHtml(t.note)}</div>` : ''}
          </div>
        </div>`;
      }
    }).join('');
  });

  list.innerHTML = html;
}

async function toggleTask(taskId){
  const t = tasks.find(x => x.id == taskId);
  if(!t) return;
  t.done = !t.done;
  saveAll();
  renderTaskDay();
  if(t._notionId && notionCfg && notionCfg.workerUrl){
    try{
      await nUpdate(t._notionId, {"완료":{checkbox: !!t.done}});
    }catch(e){
      console.warn('업무 토글 노션 동기화 실패:', e);
    }
  }
}

// ──── 업무 추가/편집 모달 ────
function openTaskAdd(date){
  openTaskForm(null, date || _taskDay);
}
function openTaskEdit(taskId){

function openTaskForm(taskId, presetDate){
  const t = taskId ? tasks.find(x => x.id == taskId) : null;
  const isEdit = !!t;
  const v = (k, def='') => t ? (t[k] != null && t[k] !== '' ? t[k] : def) : def;
  const curCat = v('cat') || '업무';
  const curAp = v('ap') || '';
  const date = v('date') || presetDate || _taskDay;

  const cats = ['업무','커머스','발주출고','샘플출고','중국입고','중국출고'];
  const catBtns = cats.map(c => `<button data-cat="${c}" class="${c===curCat?'active':''}" onclick="_pickTaskCat(this)">${c}</button>`).join('');

  const body = `
    <div class="form-r">
      <label>날짜</label>
      <input type="date" id="task_date" value="${date}">
    </div>
    <div class="form-r">
      <label>카테고리</label>
      <div class="form-pills" id="task_catPills">${catBtns}</div>
      <input type="hidden" id="task_cat" value="${curCat}">
    </div>
    <div class="form-r">
      <label>내용<span class="req">*</span></label>
      <textarea id="task_cont" placeholder="할 일 내용">${escapeHtml(v('cont'))}</textarea>
    </div>
    <div class="form-r-2">
      <div class="form-r" style="margin:0"><label>시간대</label>
        <select id="task_ap">
          <option value="" ${!curAp?'selected':''}>미지정</option>
          <option value="AM" ${curAp==='AM'?'selected':''}>오전</option>
          <option value="PM" ${curAp==='PM'?'selected':''}>오후</option>
        </select>
      </div>
      <div class="form-r" style="margin:0"><label style="font-weight:600;color:var(--t1)"><input type="checkbox" id="task_done" ${v('done')?'checked':''} style="width:auto;display:inline;margin-right:4px"> 완료</label></div>
    </div>
    <div class="form-r">
      <label>비고</label>
      <input type="text" id="task_note" placeholder="(선택)" value="${escapeHtml(v('note'))}">
    </div>
    ${!isEdit ? `
    <div style="margin-bottom:14px;padding:10px 12px;background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:7px">
      <div style="font-size:11px;color:var(--gold-lt);font-weight:700;margin-bottom:6px">💡 빠른 액션</div>
      <button onclick="openCarryOverPicker()" style="width:100%;padding:8px;background:var(--s1);border:1px solid var(--gold-line);border-radius:6px;font-size:11.5px;color:var(--gold-lt);font-weight:600">↩ 전날 미완료 업무 가져오기</button>
    </div>
    ` : ''}
    <div class="spacer"></div>
    <button class="btn-primary" onclick="saveTask(${taskId||'null'})">${isEdit?'✓ 저장':'추가'}</button>
    ${isEdit ? `<div class="spacer"></div><button class="btn-danger" onclick="deleteTask(${taskId})">🗑 삭제</button>` : ''}
  `;
  openModal(isEdit ? '📝 업무 수정' : '📝 업무 추가', body);
}

function _pickTaskCat(btn){
  document.querySelectorAll('#task_catPills button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('task_cat').value = btn.dataset.cat;
}

async function saveTask(taskId){
  const cont = document.getElementById('task_cont').value.trim();
  if(!cont){ showToast('내용을 입력해주세요','warn'); return; }
  const isEdit = !!taskId;
  const old = isEdit ? tasks.find(x => x.id == taskId) : null;

  const updated = {
    ...(old||{}),
    id: isEdit ? old.id : Date.now(),
    date: document.getElementById('task_date').value || todayStr(),
    cat: document.getElementById('task_cat').value || '업무',
    cont,
    ap: document.getElementById('task_ap').value,
    note: document.getElementById('task_note').value.trim(),
    done: document.getElementById('task_done').checked,
    createdAt: (old && old.createdAt) || new Date().toISOString()
  };

  if(notionCfg && notionCfg.workerUrl && notionCfg.taskDb){
    showToast('🔄 노션 ' + (isEdit?'수정':'등록') + ' 중...','info');
    try{
      const props = {
        "내용":{title:[{text:{content:updated.cont}}]},
        "날짜":{date:{start:updated.date}},
        "카테고리":{select:{name:updated.cat}},
        "비고":{rich_text:[{text:{content:updated.note||''}}]},
        "완료":{checkbox:!!updated.done}
      };
      if(updated.ap) props["시간대"] = {select:{name:updated.ap}};
      if(isEdit && updated._notionId){
        await nUpdate(updated._notionId, props);
      } else {
        const res = await nCreate(notionCfg.taskDb, props);
        if(res && res.id) updated._notionId = res.id;
      }
      showToast('✓ ' + (isEdit?'수정':'추가') + ' 완료','success');
    }catch(e){
      console.error(e);
      showToast('로컬에만 저장됨','warn');
    }
  } else {
    showToast('✓ ' + (isEdit?'수정':'추가') + ' (로컬)','success');
  }

  if(isEdit){
    const i = tasks.findIndex(x => x.id == taskId);
    if(i>=0) tasks[i] = updated;
  } else {
    tasks.unshift(updated);
  }
  saveAll();
  closeModal();
  renderTaskDay();
  renderDash();
}

async function deleteTask(taskId){
  const t = tasks.find(x => x.id == taskId);
  if(!t) return;
  if(!confirm(`업무 "${t.cont}"을(를) 삭제할까요?`)) return;
  if(t._notionId && notionCfg && notionCfg.workerUrl){
    try{
      await notionProxy(`/pages/${t._notionId}`, {method:'PATCH', body:JSON.stringify({archived:true})});
    }catch(e){
      showToast('노션 삭제 실패 — 로컬만 삭제','warn');
    }
  }
  tasks = tasks.filter(x => x.id != taskId);
  saveAll();
  closeModal();
  renderTaskDay();
  showToast('✓ 삭제됨','success');
}

// ──── 전날 미완료 업무 가져오기 ────
function openCarryOverPicker(){
  // 현재 보고있는 날짜 기준 — 그 이전 날짜의 미완료 업무를 모음
  const cutoffDate = _taskDay;
  // 최대 7일 전까지
  const sevenDaysAgo = new Date(cutoffDate);
  sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
  const minDate = toLocalDateStr(sevenDaysAgo);

  const candidates = tasks
    .filter(t => !t.done && t.date && t.date < cutoffDate && t.date >= minDate)
    .sort((a,b) => (b.date||'').localeCompare(a.date||''));

  if(!candidates.length){
    showToast('지난 7일 미완료 업무가 없습니다','info');
    return;
  }

  window._carryOverSel = new Set();
  const catCls = (cat) => ({
    '업무':'bizu', '커머스':'bcom',
    '발주출고':'bord', '샘플출고':'bsmp',
    '중국입고':'bship', '중국출고':'bship'
  })[cat] || 'bizu';

  // 날짜별 그룹
  const grouped = {};
  candidates.forEach(t => {
    if(!grouped[t.date]) grouped[t.date] = [];
    grouped[t.date].push(t);
  });
  const dows = ['일','월','화','수','목','금','토'];
  const groupHtml = Object.keys(grouped).sort().reverse().map(dt => {
    const d = new Date(dt);
    const dayLabel = `${pad2(d.getMonth()+1)}.${pad2(d.getDate())} (${dows[d.getDay()]})`;
    const daysAgo = Math.round((new Date(cutoffDate) - d) / (1000*60*60*24));
    return `<div style="margin-bottom:12px">
      <div style="font-size:11.5px;font-weight:700;color:var(--gold-lt);margin-bottom:6px;display:flex;justify-content:space-between">
        <span>${dayLabel}</span>
        <span style="color:var(--t3);font-weight:500">${daysAgo}일 전</span>
      </div>
      ${grouped[dt].map(t => `
        <div onclick="_toggleCarryOver(${t.id},this)" style="display:flex;gap:10px;padding:10px;background:var(--s1);border:1px solid var(--bdr-lt);border-radius:7px;margin-bottom:5px;cursor:pointer">
          <div class="task-chk co-chk" data-tid="${t.id}" style="margin-top:2px">○</div>
          <span class="task-cat ${catCls(t.cat)}">${t.cat||'업무'}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:500;word-break:break-word">${escapeHtml(t.cont)}</div>
            ${t.note ? `<div style="font-size:11px;color:var(--t3);margin-top:2px">${escapeHtml(t.note)}</div>` : ''}
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('');

  const newDate = new Date(_taskDay);
  const newDayLabel = `${pad2(newDate.getMonth()+1)}.${pad2(newDate.getDate())} (${dows[newDate.getDay()]})`;

  const body = `
    <div style="padding:10px 12px;background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:7px;margin-bottom:14px;font-size:11.5px;color:var(--gold-lt);line-height:1.55">
      <b>↩ 미완료 업무 가져오기</b><br>
      선택한 업무들을 <b>${newDayLabel}</b> 날짜로 복사/이동합니다
    </div>

function _toggleCarryOver(taskId, rowEl){
  if(window._carryOverSel.has(taskId)){
    window._carryOverSel.delete(taskId);
    rowEl.style.background = 'var(--s1)';
    rowEl.style.borderColor = 'var(--bdr-lt)';
  } else {
    window._carryOverSel.add(taskId);
    rowEl.style.background = 'var(--gold-bg)';
    rowEl.style.borderColor = 'var(--gold-line)';
  }
  const chk = rowEl.querySelector('.co-chk');
  if(chk){
    if(window._carryOverSel.has(taskId)){
      chk.classList.add('done');
      chk.textContent = '✓';
    } else {
      chk.classList.remove('done');
      chk.textContent = '○';
    }
  }
  const cntEl = document.getElementById('co_count');
  if(cntEl) cntEl.textContent = window._carryOverSel.size;
}
function _carryOverSelectAll(){
  document.querySelectorAll('.co-chk').forEach(c=>{
    const tid = +c.dataset.tid;
    const row = c.closest('[onclick]');
    if(row && !window._carryOverSel.has(tid)){
      _toggleCarryOver(tid, row);
    }
  });
}
function _carryOverSelectNone(){
  document.querySelectorAll('.co-chk').forEach(c=>{
    const tid = +c.dataset.tid;
    const row = c.closest('[onclick]');
    if(row && window._carryOverSel.has(tid)){
      _toggleCarryOver(tid, row);
    }
  });
}

async function doCarryOver(){
  const selIds = [...window._carryOverSel];
  if(!selIds.length){ showToast('선택된 업무가 없습니다','warn'); return; }
  const moveOrig = document.getElementById('co_moveOrig').checked;
  const newDate = _taskDay;
  showToast(`🔄 ${selIds.length}건 처리 중...`,'info');

  let success = 0;
  for(const tid of selIds){
    const orig = tasks.find(x => x.id == tid);
    if(!orig) continue;

    if(moveOrig){
      // 이동: 원래 task의 날짜만 변경
      orig.date = newDate;
      if(orig._notionId && notionCfg && notionCfg.workerUrl){
        try{
          await nUpdate(orig._notionId, {"날짜":{date:{start:newDate}}});
        }catch(e){ console.warn(e); }
      }
    } else {
      // 복사: 새 task 생성
      const newTask = {
        id: Date.now() + success,
        date: newDate,
        cat: orig.cat || '업무',
        cont: orig.cont,
        ap: orig.ap || '',
        note: orig.note ? `${orig.note} (${orig.date}에서 가져옴)` : `(${orig.date}에서 가져옴)`,
        done: false,
        createdAt: new Date().toISOString()
      };
      if(notionCfg && notionCfg.workerUrl && notionCfg.taskDb){
        try{
          const props = {
            "내용":{title:[{text:{content:newTask.cont}}]},
            "날짜":{date:{start:newTask.date}},
            "카테고리":{select:{name:newTask.cat}},
            "비고":{rich_text:[{text:{content:newTask.note||''}}]},
            "완료":{checkbox:false}
          };
          if(newTask.ap) props["시간대"] = {select:{name:newTask.ap}};
          const res = await nCreate(notionCfg.taskDb, props);
          if(res && res.id) newTask._notionId = res.id;
        }catch(e){ console.warn(e); }
      }
      tasks.unshift(newTask);
    }
    success++;
  }
  saveAll();
  closeModal();
  renderTaskDay();
  renderDash();
  showToast(`✓ ${success}건 ${moveOrig?'이동':'복사'} 완료`,'success');
}


function dayEvents(ds){
  const r=[];
  // 발주: "📋 VT 발주" 형식 — 같은 고객사 여러 건이면 "📋 VT 발주 ×3"
  const ordByVendor = {};
  orders.filter(o=>o.ship===ds).forEach(o=>{
    const st=o.status||'진행중';
    const isDone=st==='출고완료'||st==='취소';
    const init = getInitial(o.vendor) || '?';
    const key = init + '|' + (isDone?'1':'0');
    if(!ordByVendor[key]) ordByVendor[key] = {init, done:isDone, count:0};
    ordByVendor[key].count++;
  });
  Object.values(ordByVendor).forEach(g=>{
    const suffix = g.count > 1 ? ` ×${g.count}` : '';
    r.push({cls:'ord', done:g.done, t:`📋 ${g.init} 발주${suffix}`});
  });

  // 샘플: "💎 VT 샘플" 형식 — manager(담당자) 또는 client 정보 사용
  const smpByVendor = {};
  samples.filter(s=>s.due===ds).forEach(s=>{
    const st=s.status||'의뢰';
    const isDone=st==='완료'||st==='확정'||st==='취소';
    // 우선순위: client 이름 → manager
    const vendor = (s.client && s.client.name) || s.manager || s.brand || '';
    const init = getInitial(vendor) || '?';
    const key = init + '|' + (isDone?'1':'0');
    if(!smpByVendor[key]) smpByVendor[key] = {init, done:isDone, count:0};
    smpByVendor[key].count++;
  });
  Object.values(smpByVendor).forEach(g=>{
    const suffix = g.count > 1 ? ` ×${g.count}` : '';
    r.push({cls:'smp', done:g.done, t:`💎 ${g.init} 샘플${suffix}`});
  });

  // 입출고: "🚚 입고 VT" / "🚚 출고 PE" 형식
  const ioByVendor = {};
  ioItems.filter(io=>io.date===ds).forEach(io=>{
    const init = getInitial(io.vendor) || '?';
    const kind = io.kind || '입고';
    const key = init + '|' + kind;
    if(!ioByVendor[key]) ioByVendor[key] = {init, kind, count:0};
    ioByVendor[key].count++;
  });
  Object.values(ioByVendor).forEach(g=>{
    const suffix = g.count > 1 ? ` ×${g.count}` : '';
    r.push({cls:'ship', done:false, t:`🚚 ${g.init} ${g.kind}${suffix}`});
  });

  // 업무: "📝 업무 N" — 개수만 묶어서 표시
  const taskCount = tasks.filter(t=>t.date===ds && (t.cont||'').trim()).length;
  const taskDoneCount = tasks.filter(t=>t.date===ds && (t.cont||'').trim() && t.done).length;
  if(taskCount > 0){
    const allDone = taskDoneCount === taskCount;
    r.push({cls:'task', done:allDone, t:`📝 업무 ×${taskCount}`});
  }
  return r;
}

function renderCal(){
  const y=calCur.getFullYear(), m=calCur.getMonth();
  document.getElementById('calMo').textContent = `${y}.${pad2(m+1)}`;
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  // 평일만 (월~금)
  const dows=['월','화','수','목','금'];
  const today=toLocalDateStr(new Date());
  let html = dows.map((d,i)=>`<div class="cal-dh">${d}</div>`).join('');
  // 첫 주: 월요일부터 시작 (Date.getDay(): 일=0, 월=1, ... 토=6)
  // 월요일까지 비우기 (이전 달의 평일도 회색으로 표시)
  const firstDow = first.getDay();  // 1=월, ..., 5=금, 0=일, 6=토
  // 월요일 = 0번째 셀, 금요일 = 4번째 셀
  let startOffset = 0;
  if(firstDow === 0) startOffset = 0;       // 일 → 다음 월부터 시작 (셀 0)
  else if(firstDow === 6) startOffset = 0;  // 토 → 다음 월부터 시작 (셀 0)
  else startOffset = firstDow - 1;          // 월=0, 화=1, ..., 금=4
  // 이전 달 평일 채우기 (회색)
  for(let i=0; i<startOffset; i++){
    const pd = new Date(y, m, -(startOffset-1-i));
    html += `<div class="cal-c other"><div class="dn">${pd.getDate()}</div></div>`;
  }
  // 이번 달 모든 날 → 평일만 표시
  let weekCellCount = startOffset;
  for(let d=1; d<=last.getDate(); d++){
    const dt = new Date(y,m,d), ds = toLocalDateStr(dt), dow = dt.getDay();
    // 토/일 스킵
    if(dow === 0 || dow === 6) continue;
    const evs = dayEvents(ds);
    const cls=['cal-c'];
    if(KR_HOLIDAYS[ds]) cls.push('holiday');
    if(ds===today) cls.push('today');
    if(evs.length) cls.push('has-ev');
    let evHtml = evs.slice(0,3).map(e=>`<div class="cal-ev ${e.cls}${e.done?' done':''}">${escapeHtml(e.t)}</div>`).join('');
    if(evs.length>3) evHtml += `<div class="cal-ev-more">+${evs.length-3}</div>`;
    html += `<div class="${cls.join(' ')}" onclick="openDayPop('${ds}')"><div class="dn">${d}</div>${evHtml}</div>`;
    weekCellCount++;
  }
  // 마지막 주 평일 빈 셀 (다음 달)
  const rem = (5 - weekCellCount % 5) % 5;
  for(let i=1; i<=rem; i++){
    html += `<div class="cal-c other"><div class="dn">${i}</div></div>`;
  }
  document.getElementById('calGrid').innerHTML = html;
}

    ios.forEach(io=>{

      html += `<div onclick="closeDayPop();showIoDetail(${io.id})" style="padding:9px;border:1px solid var(--bdr-lt);border-radius:6px;margin-bottom:6px;font-size:13px;cursor:pointer"><div style="display:flex;gap:6px;align-items:center"><span style="font-size:14px">${isShip?'📤':'📥'}</span><span style="font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis">${escapeHtml(io.title||io.vendor||'기록')}</span></div><div style="font-size:11px;color:var(--t3);margin-top:2px">${escapeHtml((io.items||'').slice(0,40))}</div></div>`;

// 현재 상태 필터 적용된 발주 (고객사 필터는 적용 안함)
function _getOrdAfterStatusFilter(){
  let list = orders.slice();
  if(_ordFilter==='active') list = list.filter(o=>{ const st=o.status||'진행중'; return st!=='출고완료'&&st!=='취소'&&st!=='보류'; });
  else if(_ordFilter==='done') list = list.filter(o=>o.status==='출고완료');
  else if(_ordFilter==='hold') list = list.filter(o=>o.status==='보류');
  return list;
}

function renderOrdCliFilter(){
  const wrap = document.getElementById('ordCliFbar');
  if(!wrap) return;
  // 현재 상태 필터 적용 후 고객사별 카운트
  const list = _getOrdAfterStatusFilter();
  // 이니셜 기준 그룹화 (같은 이니셜의 다른 표기명 통합)
  const initGroups = {}; // { 이니셜: {count, names:[], rep} }
  list.forEach(o => {
    const v = (o.vendor||'').trim();
    if(!v) return;
    const init = getInitial(v) || '??';
    if(!initGroups[init]) initGroups[init] = {count:0, names:new Set(), rep:v};
    initGroups[init].count++;
    initGroups[init].names.add(v);
  });
  // 정렬: 카운트 많은 순 → 이니셜순
  const sorted = Object.entries(initGroups).sort((a,b) => b[1].count-a[1].count || a[0].localeCompare(b[0]));
  if(!sorted.length){
    wrap.innerHTML = '';
    wrap.style.display = 'none';
    return;
  }
  wrap.style.display = 'flex';
  // 전체 칩 + 각 고객사 칩
  const totalCount = list.length;
  const allChip = `<button class="${_ordCliFilter==='all'?'active':''}" data-cli="all" onclick="setOrdCliFilter('all')">전체 <span class="cli-cnt">${totalCount}</span></button>`;
  const chips = sorted.map(([init, g]) => {
    const color = strColor(g.rep);
    const isAct = _ordCliFilter === init;
    // 툴팁(title)에 풀네임 표시 (이니셜이 무엇인지 확인 가능)
    const tooltip = [...g.names].join(', ');
    return `<button class="${isAct?'active':''}" data-cli="${escapeHtml(init)}" onclick="setOrdCliFilter('${init.replace(/'/g,"\\'")}')" title="${escapeHtml(tooltip)}"><span class="cli-bdg" style="background:${color}">${init}</span><span class="cli-cnt">${g.count}</span></button>`;
  }).join('');
  wrap.innerHTML = allChip + chips;
}

function renderOrdList(){
  const q = (document.getElementById('ordSearch')?.value||'').toLowerCase();
  let list = _getOrdAfterStatusFilter();
  // 고객사 필터 (이니셜 기준 매칭 — 같은 이니셜의 다른 표기명도 포함)
  if(_ordCliFilter !== 'all'){
    list = list.filter(o => getInitial(o.vendor||'') === _ordCliFilter);
  }
  if(q) list = list.filter(o=>{
    return (o.vendor||'').toLowerCase().includes(q) || (o.no||'').toLowerCase().includes(q) || (o.rows||[]).some(r=>(r.name||'').toLowerCase().includes(q));
  });
  list.sort((a,b)=>(b.ship||'').localeCompare(a.ship||''));
  document.getElementById('ordCnt').textContent = list.length;
  const el = document.getElementById('ordList');
  if(!list.length){
    el.innerHTML = `<div class="empty"><div class="icn">📭</div>발주서가 없습니다</div>`;
    return;
  }
  el.innerHTML = list.map(o=>{
    const st = o.status||'진행중';
    const stCls = st==='출고완료'?'s-done':st==='취소'?'s-cancel':st==='보류'?'s-hold':st==='제작중'?'s-make':st==='수정중'?'s-fix':'s-prog';
    const dd = ddayLabel(o.ship);
    const isDone = st==='출고완료'||st==='취소';
    const ddHtml = dd && !isDone ? `<span class="dday ${dd.cls}">${dd.t}</span>` : '';
    const rowsHtml = (o.rows||[]).slice(0,3).map(r=>`<span class="item">${escapeHtml((r.name||'').slice(0,15))} ×${parseQty(r.qty)||0}</span>`).join('');
    const moreRows = (o.rows||[]).length>3 ? `<span class="item" style="background:transparent;border:none">+${(o.rows||[]).length-3}</span>` : '';
    return `<div class="list-item" onclick="showOrdDetail(${o.id})">
      <div class="li-h">
        ${initBadge(o.vendor)}
        <span class="li-vendor">${escapeHtml(getInitial(o.vendor)||'-')}</span>
        ${ddHtml}
        <span class="li-status ${stCls}">${_ordStLabel(st)}</span>
      </div>
      <div class="li-meta">
        <span><span class="lbl">발주</span> ${escapeHtml(o.no||'-')}</span>
        <span><span class="lbl">출고</span> ${escapeHtml(o.ship||'-')}</span>
      </div>
      ${(o.rows||[]).length ? `<div class="li-rows">${rowsHtml}${moreRows}</div>` : ''}
    </div>`;
  }).join('');
}
