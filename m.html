function _getSmpAfterStatusFilter(){
  let list = samples.slice();
  if(_smpFilter==='active') list = list.filter(s=>{ const st=s.status||'의뢰'; return st!=='완료'&&st!=='확정'&&st!=='취소'; });
  else if(_smpFilter==='done') list = list.filter(s=>{ const st=s.status||'의뢰'; return st==='완료'||st==='확정'; });
  return list;
}

function renderSmpCliFilter(){
  const wrap = document.getElementById('smpCliFbar');
  if(!wrap) return;
  const list = _getSmpAfterStatusFilter();
  // 이니셜 기준 그룹화
  const initGroups = {};
  list.forEach(s => {
    const m = (s.manager||'').trim();
    if(!m) return;
    const init = getInitial(m) || '??';
    if(!initGroups[init]) initGroups[init] = {count:0, names:new Set(), rep:m};
    initGroups[init].count++;
    initGroups[init].names.add(m);
  });
  const sorted = Object.entries(initGroups).sort((a,b) => b[1].count-a[1].count || a[0].localeCompare(b[0]));
  if(!sorted.length){
    wrap.innerHTML = '';
    wrap.style.display = 'none';
    return;
  }
  wrap.style.display = 'flex';
  const totalCount = list.length;
  const allChip = `<button class="${_smpCliFilter==='all'?'active':''}" data-cli="all" onclick="setSmpCliFilter('all')">전체 <span class="cli-cnt">${totalCount}</span></button>`;
  const chips = sorted.map(([init, g]) => {
    const color = strColor(g.rep);
    const isAct = _smpCliFilter === init;
    const tooltip = [...g.names].join(', ');
    return `<button class="${isAct?'active':''}" data-cli="${escapeHtml(init)}" onclick="setSmpCliFilter('${init.replace(/'/g,"\\'")}')" title="${escapeHtml(tooltip)}"><span class="cli-bdg" style="background:${color}">${init}</span><span class="cli-cnt">${g.count}</span></button>`;
  }).join('');
  wrap.innerHTML = allChip + chips;
}

function renderSmpList(){
  const q = (document.getElementById('smpSearch')?.value||'').toLowerCase();
  let list = _getSmpAfterStatusFilter();
  // 고객사(담당자) 필터 (이니셜 기준)
  if(_smpCliFilter !== 'all'){
    list = list.filter(s => getInitial(s.manager||'') === _smpCliFilter);
  }
  if(q) list = list.filter(s=>(s.name||'').toLowerCase().includes(q) || (s.itemCode||'').toLowerCase().includes(q));
  list.sort((a,b)=>(b.due||b.reqDate||'').localeCompare(a.due||a.reqDate||''));
  document.getElementById('smpCnt').textContent = list.length;
  const el = document.getElementById('smpList');
  if(!list.length){
    el.innerHTML = `<div class="empty"><div class="icn">💎</div>샘플이 없습니다</div>`;
    return;
  }
  el.innerHTML = list.map(s=>{
    const st = s.status||'의뢰';
    const stCls = st==='완료'||st==='확정'?'s-done':st==='취소'?'s-cancel':st==='수정중'?'s-fix':st==='제작중'?'s-make':'s-req';
    const dd = ddayLabel(s.due);
    const isDone = st==='완료'||st==='확정'||st==='취소';
    const ddHtml = dd && !isDone ? `<span class="dday ${dd.cls}">${dd.t}</span>` : '';
    return `<div class="list-item" onclick="showSmpDetail(${s.id})">
      <div class="li-h">
        ${initBadge(s.manager)}
        <span class="li-vendor">${escapeHtml(s.name||'(이름없음)')}</span>
        ${ddHtml}
        <span class="li-status ${stCls}">${st}</span>
      </div>
      <div class="li-meta">
        ${s.manager?`<span><span class="lbl">고객</span> ${escapeHtml(getInitial(s.manager)||'-')}</span>`:''}
        <span><span class="lbl">유형</span> ${escapeHtml(s.type||'-')}</span>
        <span><span class="lbl">소재</span> ${escapeHtml(s.mat||'-')}</span>
        ${s.itemCode?`<span style="font-family:monospace;color:var(--gold-lt);font-weight:600">${escapeHtml(s.itemCode)}</span>`:''}
      </div>
    </div>`;
  }).join('');
}

// ──── 입출고 리스트 ────
let _ioFilter = 'all';
let _ioMode = 'all'; // 'all' (전체) | 'commerce' (커머스)
let _ioCommerceMode = 'ship'; // 'ship' | 'return'
let _ioReturnStage = 'pending'; // 'pending' | 'done' | 'all'

function setIoFilter(f){
  _ioFilter = f;
  document.querySelectorAll('#ioFbarAll button').forEach(b=>b.classList.toggle('active', b.dataset.st===f));
  renderIoList();
}
function setIoMode(m){
  _ioMode = m;
  document.querySelectorAll('#pgIO .seg button').forEach(b=>b.classList.toggle('active', b.dataset.iomode===m));
  // 보일/숨길 필터 영역
  document.getElementById('ioFbarAll').style.display = m==='all' ? 'flex' : 'none';
  document.getElementById('ioFbarCommerce').style.display = m==='commerce' ? 'flex' : 'none';
  document.getElementById('ioFbarReturnStage').style.display = (m==='commerce' && _ioCommerceMode==='return') ? 'flex' : 'none';
  renderIoList();
}
function setIoCommerceMode(cm){
  _ioCommerceMode = cm;
  document.querySelectorAll('#ioFbarCommerce button').forEach(b=>b.classList.toggle('active', b.dataset.cm===cm));
  document.getElementById('ioFbarReturnStage').style.display = cm==='return' ? 'flex' : 'none';
  renderIoList();
}
function setIoReturnStage(rs){
  _ioReturnStage = rs;
  document.querySelectorAll('#ioFbarReturnStage button').forEach(b=>b.classList.toggle('active', b.dataset.rs===rs));
  renderIoList();
}

function renderIoList(){
  const q = (document.getElementById('ioSearch')?.value||'').toLowerCase();
  let list = ioItems.slice();

  // 모드별 필터링
  if(_ioMode === 'commerce'){
    // 커머스: brand 있는 것만
    list = list.filter(io => !!io.brand);
    if(_ioCommerceMode === 'ship'){
      // 출고 모드: 교환/환불 없는 것
      list = list.filter(io => !io.returnStatus || io.returnStatus === '정상');
    } else {
      // 교환/환불 모드: returnStatus 있는 것
      list = list.filter(io => io.returnStatus && io.returnStatus !== '정상');
      if(_ioReturnStage === 'pending'){
        list = list.filter(io => io.returnStatus === '교환요청' || io.returnStatus === '환불요청');
      } else if(_ioReturnStage === 'done'){
        list = list.filter(io => io.returnStatus === '교환완료' || io.returnStatus === '환불완료');
      }
    }
  } else {
    // 전체 모드: 커머스 제외 (B2B만)
    list = list.filter(io => !io.brand);
    if(_ioFilter !== 'all') list = list.filter(io => io.kind === _ioFilter);
  }

  // 검색
  if(q){
    list = list.filter(io =>
      (io.title||'').toLowerCase().includes(q) ||
      (io.vendor||'').toLowerCase().includes(q) ||
      (io.items||'').toLowerCase().includes(q) ||
      (io.recipient||'').toLowerCase().includes(q) ||
      (io.returnReason||'').toLowerCase().includes(q)
    );
  }
  list.sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  // 커머스 모드 뱃지 업데이트
  const cmAll = ioItems.filter(io => !!io.brand);
  const cmReturnPending = cmAll.filter(io => io.returnStatus === '교환요청' || io.returnStatus === '환불요청').length;
  const cmBdg = document.getElementById('ioModeCommerceBdg');
  if(cmBdg){
    if(cmReturnPending > 0){
      cmBdg.textContent = cmReturnPending;
      cmBdg.style.display = '';
      cmBdg.style.background = 'var(--red)';
      cmBdg.style.color = '#fff';
      cmBdg.style.padding = '0 6px';
      cmBdg.style.borderRadius = '8px';
      cmBdg.style.fontSize = '10px';
      cmBdg.style.fontWeight = '700';
      cmBdg.style.marginLeft = '3px';
    } else if(cmAll.length > 0){
      cmBdg.textContent = cmAll.length;
      cmBdg.style.display = '';
      cmBdg.style.background = 'var(--s2)';
      cmBdg.style.color = 'var(--t3)';
      cmBdg.style.padding = '0 6px';
      cmBdg.style.borderRadius = '8px';
      cmBdg.style.fontSize = '10px';
      cmBdg.style.fontWeight = '600';
      cmBdg.style.marginLeft = '3px';
    } else {
      cmBdg.style.display = 'none';
    }
  }
  const rtBdg = document.getElementById('ioReturnBdg');
  if(rtBdg){
    if(cmReturnPending > 0){
      rtBdg.textContent = cmReturnPending;
      rtBdg.style.display = '';
      rtBdg.style.background = 'var(--red)';
      rtBdg.style.color = '#fff';
      rtBdg.style.padding = '0 6px';
      rtBdg.style.borderRadius = '8px';
      rtBdg.style.fontSize = '10px';
      rtBdg.style.fontWeight = '700';
      rtBdg.style.marginLeft = '3px';
    } else {
      rtBdg.style.display = 'none';
    }
  }

  // 리스트 제목
  const titleEl = document.getElementById('ioListTitle');
  if(titleEl){
    if(_ioMode === 'commerce' && _ioCommerceMode === 'return'){
      titleEl.innerHTML = `🔄 교환/환불 <span class="cnt" id="ioCnt">${list.length}</span>`;
    } else if(_ioMode === 'commerce'){
      titleEl.innerHTML = `🛍 커머스 출고 <span class="cnt" id="ioCnt">${list.length}</span>`;
    } else {
      titleEl.innerHTML = `입출고 기록 <span class="cnt" id="ioCnt">${list.length}</span>`;
    }
  }
  document.getElementById('ioCnt').textContent = list.length;
  const el = document.getElementById('ioList');
  if(!list.length){
    const emptyMsg = _ioMode === 'commerce' && _ioCommerceMode === 'return'
      ? (_ioReturnStage==='pending' ? '입고 대기 중인 교환·환불이 없습니다' : _ioReturnStage==='done' ? '완료된 교환·환불이 없습니다' : '교환·환불 건이 없습니다')
      : _ioMode === 'commerce' ? '커머스 출고 기록이 없습니다' : '기록이 없습니다';
    const emptyIcon = _ioMode === 'commerce' && _ioCommerceMode === 'return' ? '🔄' : _ioMode === 'commerce' ? '🛍' : '🚚';
    el.innerHTML = `<div class="empty"><div class="icn">${emptyIcon}</div>${emptyMsg}<br><span style="font-size:11px;margin-top:6px;display:block;color:var(--t3)">${_ioMode==='commerce'&&_ioCommerceMode==='return'?'출고에서 🔄/↩ 등록으로 추가':'+ 버튼으로 등록'}</span></div>`;
    return;
  }

  // 모드별 렌더링
  if(_ioMode === 'commerce' && _ioCommerceMode === 'return'){
    // 교환/환불 카드
    el.innerHTML = list.map(io=>{
      const rs = io.returnStatus || '';
      const isExchange = rs.includes('교환');
      const isReturnDone = rs === '교환완료' || rs === '환불완료';
      const isReturnPending = rs === '교환요청' || rs === '환불요청';
      const typeIcon = isExchange ? '🔄' : '↩';
      const typeLabel = isExchange ? '교환' : '환불';
      const stageCls = isReturnPending ? 's-fix' : 's-done';
      const stageLabel = isReturnPending ? '⏳ 입고대기' : '✓ 완료';
      const cardStyle = isReturnDone
        ? 'text-decoration:line-through;color:var(--t3);opacity:.6'
        : isReturnPending
        ? 'background:rgba(168,90,16,.05);border-left:3px solid var(--org)'
        : '';
      const actionBtn = isReturnPending
        ? `<button onclick="event.stopPropagation();mConfirmReturnComplete(${io.id})" style="padding:5px 10px;font-size:11px;background:var(--grn);border:1px solid var(--grn);border-radius:5px;color:#fff;font-weight:700;font-family:inherit">✓ 입고확인</button>`
        : `<button onclick="event.stopPropagation();mUndoReturnComplete(${io.id})" style="padding:5px 10px;font-size:11px;background:transparent;border:1px solid var(--bdr);border-radius:5px;color:var(--t3);font-family:inherit">↶ 되돌리기</button>`;
      return `<div class="list-item" style="${cardStyle}" onclick="showIoDetail(${io.id})">
        <div class="li-h">
          <span class="li-status ${isExchange?'s-make':'s-cancel'}">${typeIcon} ${typeLabel}</span>
          <span class="li-vendor" style="flex:1">${escapeHtml(io.recipient||io.vendor||'-')}</span>
          <span class="li-status ${stageCls}">${stageLabel}</span>
        </div>
        <div class="li-meta">
          ${io.brand?`<span><span class="lbl">브랜드</span> ${escapeHtml(io.brand)}</span>`:''}
          ${io.phone?`<span style="font-family:monospace">${escapeHtml(io.phone)}</span>`:''}
          ${io.returnRequestedAt?`<span><span class="lbl">요청</span> ${escapeHtml(io.returnRequestedAt)}</span>`:''}
        </div>
        ${io.items?`<div style="font-size:11.5px;color:var(--t2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📦 ${escapeHtml(io.items)}</div>`:''}
        ${io.returnReason?`<div style="font-size:11px;color:var(--t3);margin-top:3px">💭 ${escapeHtml(io.returnReason)}</div>`:''}
        <div style="margin-top:8px;display:flex;justify-content:flex-end;gap:6px" onclick="event.stopPropagation()">${actionBtn}</div>
      </div>`;
    }).join('');
  } else if(_ioMode === 'commerce'){
    // 커머스 출고 카드
    el.innerHTML = list.map(io=>{
      return `<div class="list-item" onclick="showIoDetail(${io.id})">
        <div class="li-h">
          <span class="li-status s-make">🛍 ${escapeHtml(io.brand||'')}</span>
          <span class="li-vendor" style="flex:1">${escapeHtml(io.recipient||'-')}</span>
          ${io.matchStatus==='자동매칭'?'<span class="li-status s-done">✓ 매칭</span>':io.matchStatus==='미매칭'?'<span class="li-status s-cancel">미매칭</span>':''}
        </div>
        <div class="li-meta">
          ${io.phone?`<span style="font-family:monospace">${escapeHtml(io.phone)}</span>`:''}
          <span>${escapeHtml(io.date||'-')}</span>
        </div>
        ${io.items?`<div style="font-size:11.5px;color:var(--t2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📦 ${escapeHtml(io.items)}</div>`:''}
        ${io.address?`<div style="font-size:11px;color:var(--t3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📍 ${escapeHtml(io.address)}</div>`:''}
        <div style="margin-top:8px;display:flex;justify-content:flex-end" onclick="event.stopPropagation()">
          <button onclick="mOpenReturnModal(${io.id})" style="padding:4px 9px;font-size:10.5px;background:transparent;border:1px solid var(--bdr);border-radius:5px;color:var(--t2);font-family:inherit">🔄/↩ 교환·환불 등록</button>
        </div>
      </div>`;
    }).join('');
  } else {
    // 전체 (B2B) 카드 - 기존 스타일
    el.innerHTML = list.map(io=>{
      const isShip = io.kind==='출고';
      const isExchange = io.kind==='교환';
      const isRepair = io.kind==='수리';
      const iconCls = isShip?'ship':(isExchange||isRepair)?'ship':'recv';
      const icon = isShip?'📤':isRepair?'🔧':isExchange?'🔄':'📥';
      return `<div class="io-item" onclick="showIoDetail(${io.id})">
        <div class="io-icn ${iconCls}">${icon}</div>
        <div class="io-info">
          <div class="io-title">${escapeHtml(io.title||io.vendor||'기록')}</div>
          <div class="io-meta">
            <span>${escapeHtml(io.date||'-')}</span>
            ${io.vendor?`<span>· ${escapeHtml(io.vendor)}</span>`:''}
            ${io.flow?`<span>· ${escapeHtml(io.flow)}</span>`:''}
            ${io.qty?`<span>· ${io.qty}개</span>`:''}
          </div>
          ${io.items?`<div style="font-size:11.5px;color:var(--t2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(io.items)}</div>`:''}
        </div>
      </div>`;
    }).join('');
  }
}

// ──── 모바일 교환/환불 모달 ────
function mOpenReturnModal(ioId){
  const io = ioItems.find(x=>x.id==ioId);
  if(!io){ showToast('항목을 찾을 수 없음', 'warn'); return; }
  if(io.returnStatus && io.returnStatus !== '정상'){
    showToast('⚠ 이미 교환/환불이 등록된 항목', 'warn');
    return;
  }
  const today = todayStr();
  const body = `
    <div style="background:var(--s2);border-radius:8px;padding:10px;margin-bottom:12px;font-size:12.5px">
      <div style="font-weight:700;margin-bottom:3px">${escapeHtml(io.brand||'-')} · ${escapeHtml(io.recipient||'-')}</div>
      <div style="font-size:11px;color:var(--t3)">${escapeHtml(io.phone||'')}</div>
      <div style="color:var(--t2);font-size:11.5px;margin-top:4px">${escapeHtml(io.items||'')}</div>
      ${io._matchedProductId?'<div style="color:var(--grn);font-size:11px;margin-top:3px;font-weight:600">✓ 매칭됨 — 입고확인 시 재고 +1 복원</div>':'<div style="color:var(--org);font-size:11px;margin-top:3px">⚠ 미매칭 — 재고 복원 안 됨</div>'}
    </div>
    <div class="form-r"><label>구분<span class="req">*</span></label>
      <div style="display:flex;gap:8px">
        <label style="flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:10px;border:2px solid var(--gold-line);background:var(--gold-bg);color:var(--gold-lt);border-radius:6px;cursor:pointer;font-weight:600" id="rt_ex_lbl" onclick="document.getElementById('rt_ex').checked=true;mUpdateRtUI()">
          <input type="radio" name="rt_type" value="교환" id="rt_ex" checked style="margin:0">🔄 교환
        </label>
        <label style="flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:10px;border:2px solid var(--bdr);border-radius:6px;cursor:pointer;font-weight:600;color:var(--t2)" id="rt_rf_lbl" onclick="document.getElementById('rt_rf').checked=true;mUpdateRtUI()">
          <input type="radio" name="rt_type" value="환불" id="rt_rf" style="margin:0">↩ 환불
        </label>
      </div>
    </div>
    <div class="form-r"><label>요청일</label><input type="date" id="rt_date" value="${today}"></div>
    <div class="form-r"><label>사유</label><textarea id="rt_reason" rows="3" placeholder="예: 사이즈 변경 / 단순 변심"></textarea></div>
    <div style="background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:6px;padding:9px 11px;margin-top:8px;font-size:11px;color:var(--t2)">
      💡 등록 후 실제 입고가 도착하면 <b>입고확인</b>을 눌러주세요. 재고가 자동 복원됩니다.
    </div>
  `;
  openModal('🔄/↩ 교환·환불 등록', body, ()=>mSaveReturn(io.id));
}
function mUpdateRtUI(){
  const ex = document.getElementById('rt_ex');
  const exLbl = document.getElementById('rt_ex_lbl');
  const rfLbl = document.getElementById('rt_rf_lbl');
  if(!ex||!exLbl||!rfLbl) return;
  if(ex.checked){
    exLbl.style.borderColor='var(--gold-line)'; exLbl.style.background='var(--gold-bg)'; exLbl.style.color='var(--gold-lt)';
    rfLbl.style.borderColor='var(--bdr)'; rfLbl.style.background='transparent'; rfLbl.style.color='var(--t2)';
  } else {
    rfLbl.style.borderColor='var(--gold-line)'; rfLbl.style.background='var(--gold-bg)'; rfLbl.style.color='var(--gold-lt)';
    exLbl.style.borderColor='var(--bdr)'; exLbl.style.background='transparent'; exLbl.style.color='var(--t2)';
  }
}
async function mSaveReturn(ioId){
  const io = ioItems.find(x=>x.id==ioId);
  if(!io) return;
  const type = document.querySelector('input[name="rt_type"]:checked')?.value || '교환';
  const date = document.getElementById('rt_date')?.value || todayStr();
  const reason = (document.getElementById('rt_reason')?.value||'').trim();
  io.returnStatus = type === '교환' ? '교환요청' : '환불요청';
  io.returnType = type;
  io.returnReason = reason;
  io.returnRequestedAt = date;
  io.returnCompletedAt = '';
  saveAll();
  closeModal();
  showToast(`✓ ${type} 등록됨 — 입고 대기`, 'success');
  renderIoList();
  // 노션 동기화
  if(notionCfg && notionCfg.workerUrl && notionCfg.ioDb && io._notionId){
    try{
      await nUpdate(io._notionId, {
        "반품상태":{select:{name:io.returnStatus}},
        "반품사유":{rich_text:[{text:{content:reason.slice(0,2000)}}]},
        "반품요청일":{date:{start:date}}
      });
    }catch(e){console.warn('교환환불 sync 실패',e);}
  }
}

async function mConfirmReturnComplete(ioId){
  const io = ioItems.find(x=>x.id==ioId);
  if(!io) return;
  if(io.returnStatus !== '교환요청' && io.returnStatus !== '환불요청') return;
  const type = io.returnType || (io.returnStatus === '교환요청' ? '교환' : '환불');
  const willRestock = io._matchedProductId != null;
  if(!confirm(`${type} 입고가 도착했습니까?\n수령인: ${io.recipient||'-'}\n품목: ${io.items||'-'}${willRestock?'\n\n📦 재고 +1 복원됩니다.':''}`)) return;
  const today = todayStr();
  io.returnStatus = type === '교환' ? '교환완료' : '환불완료';
  io.returnCompletedAt = today;
  // 재고 복원 (모바일 stockHistory 기록 단순)
  if(io._matchedProductId != null){
    const p = productDB.find(x=>x.id==io._matchedProductId);
    if(p){
      p.stock = (+p.stock||0) + 1;
      stockHistory.push({
        id: Date.now()+Math.random(),
        productId: p.id,
        productName: p.name||'',
        productCode: p.code||'',
        delta: +1,
        prevStock: (+p.stock||0)-1,
        newStock: +p.stock||0,
        type: 'commerce_return',
        refId: io.id,
        refLabel: `${type==='교환'?'🔄 교환':'↩ 환불'} 입고 / ${io.brand||''} / ${io.recipient||''}`,
        note: io.title||'',
        when: new Date().toISOString()
      });
    }
  }
  saveAll();
  showToast(`✓ ${type} 완료${io._matchedProductId?' · 재고 +1 복원':''}`, 'success');
  renderIoList();
  if(notionCfg && notionCfg.workerUrl && notionCfg.ioDb && io._notionId){
    try{
      await nUpdate(io._notionId, {
        "반품상태":{select:{name:io.returnStatus}},
        "반품입고일":{date:{start:today}}
      });
    }catch(e){console.warn('교환환불 sync 실패',e);}
  }
}

async function mUndoReturnComplete(ioId){
  const io = ioItems.find(x=>x.id==ioId);
  if(!io) return;
  if(io.returnStatus !== '교환완료' && io.returnStatus !== '환불완료') return;
  const type = io.returnType || (io.returnStatus === '교환완료' ? '교환' : '환불');
  if(!confirm(`입고 확인을 취소하고 "${type}요청" 상태로 되돌립니다.\n복원했던 재고도 다시 -1로 차감됩니다.\n\n계속?`)) return;
  io.returnStatus = type === '교환' ? '교환요청' : '환불요청';
  io.returnCompletedAt = '';
  if(io._matchedProductId != null){
    const p = productDB.find(x=>x.id==io._matchedProductId);
    if(p){
      p.stock = (+p.stock||0) - 1;
      stockHistory.push({
        id: Date.now()+Math.random(),
        productId: p.id,
        productName: p.name||'',
        productCode: p.code||'',
        delta: -1,
        prevStock: (+p.stock||0)+1,
        newStock: +p.stock||0,
        type: 'commerce_return_undo',
        refId: io.id,
        refLabel: `${type} 입고확인 취소`,
        note: '되돌리기',
        when: new Date().toISOString()
      });

  }

  showToast(`↶ 되돌림 — ${type} 요청 상태`, 'warn');

}

let _prodLowOnly = false; // 재고 부족(안전재고 이하)만 표시

function setProdLowOnly(on){

function renderProdList(){
  // 타입 바
  const types = ['all', ...new Set(productDB.map(p=>p.type).filter(Boolean))];
  const typeBar = document.getElementById('prodTypeBar');
  typeBar.innerHTML = types.map(t=>`<button class="${t===_prodType?'active':''}" onclick="setProdType('${t}')">${t==='all'?'전체':t}</button>`).join('');

  // 재고 부족 카운트는 항상 (필터링 전 전체 기준으로) 계산해서 버튼에 표시
  const lowCount = productDB.filter(p=>{
    const stock = +p.stock||0, safety = +p.safetyStock||0;
    return safety > 0 && stock <= safety;
  }).length;
  const lowBtn = document.getElementById('prodLowBtn');
  if(lowBtn){
    lowBtn.innerHTML = `⚠ 재고 부족${lowCount > 0 ? ' <span style="font-size:10px;opacity:.8">'+lowCount+'</span>' : ''}`;
  }

  const q = (document.getElementById('prodSearch')?.value||'').toLowerCase();
  let list = productDB.slice();
  if(_prodType!=='all') list = list.filter(p=>p.type===_prodType);
  if(_prodLowOnly){
    list = list.filter(p=>{
      const stock = +p.stock||0, safety = +p.safetyStock||0;
      return safety > 0 && stock <= safety;
    });
  }
  if(q) list = list.filter(p=>(p.name||'').toLowerCase().includes(q) || (p.code||'').toLowerCase().includes(q));
  list.sort((a,b)=>(b.id||0)-(a.id||0));
  document.getElementById('prodCnt').textContent = list.length;
  const el = document.getElementById('prodList');
  if(!list.length){
    const emptyMsg = _prodLowOnly ? '재고 부족 제품이 없습니다 ✓' : '제품이 없습니다';
    el.innerHTML = `<div class="empty"><div class="icn">📦</div>${emptyMsg}</div>`;
    return;
  }
  el.innerHTML = list.map(p=>{
    const img = p.imgs && p.imgs.length ? (typeof p.imgs[0]==='string'?p.imgs[0]:(p.imgs[0].url||'')) : '';
    const stock = +p.stock||0, safety = +p.safetyStock||0;
    const stockCls = stock<=0?'out':(safety>0&&stock<=safety?'low':'');
    return `<div class="prod-item" onclick="showProdDetail(${p.id})">
      <div class="prod-thumb">${img?`<img src="${img}" alt="">`:'📦'}</div>
      <div class="prod-info">
        <div class="prod-name">${escapeHtml(p.name||'(이름없음)')}</div>
        <div class="prod-meta">
          ${p.code?`<span class="prod-code">${escapeHtml(p.code)}</span>`:''}
          ${p.type?`<span>· ${escapeHtml(p.type)}</span>`:''}
          ${p.mat?`<span>· ${escapeHtml(p.mat)}</span>`:''}
        </div>
        <div class="prod-price">${p.price?`₩${(+p.price).toLocaleString()}`:'-'}<span class="prod-stock ${stockCls}">재고 ${stock}${safety>0?`/${safety}`:''}</span></div>
      </div>
    </div>`;
  }).join('');
}
function setProdType(t){ _prodType=t; renderProdList(); }

// ──── 재고 카운트 모드 ────
// 창고에서 실제 재고를 세면서 핸드폰으로 바로 입력 → 한꺼번에 저장
// _stockCountBuf: {productId: {countedQty, prevStock}}
let _stockCountBuf = {};

function openStockCountMode(){
  if(!productDB.length){
    showToast('⚠ 제품 DB가 비어있습니다', 'warn');
    return;
  }
  _stockCountBuf = {};
  _renderStockCountModal();
}

function _renderStockCountModal(){
  const q = (window._scQuery||'').toLowerCase();
  let list = productDB.slice();
  if(q){
    list = list.filter(p =>
      (p.name||'').toLowerCase().includes(q) ||
      (p.code||'').toLowerCase().includes(q)
    );
  }
  // 이미 카운트된 항목 우선 (작업 중인 것들이 위에)
  list.sort((a,b)=>{
    const aC = a.id in _stockCountBuf ? 0 : 1;
    const bC = b.id in _stockCountBuf ? 0 : 1;
    if(aC !== bC) return aC - bC;
    return (a.name||'').localeCompare(b.name||'', 'ko');
  });

  const countedCount = Object.keys(_stockCountBuf).length;
  const changeCount = Object.values(_stockCountBuf).filter(c => c.countedQty !== c.prevStock).length;

  const itemsHtml = list.slice(0, 100).map(p=>{
    const img = p.imgs && p.imgs.length ? (typeof p.imgs[0]==='string'?p.imgs[0]:(p.imgs[0].url||'')) : '';
    const stock = +p.stock||0;
    const safety = +p.safetyStock||0;
    const counted = _stockCountBuf[p.id];
    const isCounted = counted !== undefined;
    const newQty = isCounted ? counted.countedQty : '';
    const diff = isCounted ? counted.countedQty - stock : 0;
    const diffColor = diff > 0 ? 'var(--grn)' : diff < 0 ? 'var(--red)' : 'var(--t3)';
    const diffStr = diff !== 0 ? (diff > 0 ? `+${diff}` : `${diff}`) : '';
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--bdr-lt);background:${isCounted?'var(--gold-bg)':'transparent'}">
      <div style="width:36px;height:36px;border-radius:5px;background:var(--s2);border:1px solid var(--bdr-lt);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--t3)">${img?`<img src="${img}" style="width:100%;height:100%;object-fit:cover">`:'📦'}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:12.5px;font-weight:600;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(p.name||'')}</div>
        <div style="font-size:10.5px;color:var(--t3);font-family:monospace">현재: <b>${stock}</b>${safety>0?` / 안전 ${safety}`:''}</div>
      </div>
      <input type="number" inputmode="numeric" pattern="[0-9]*" value="${newQty}" onchange="_setStockCount(${p.id}, this.value, ${stock})" placeholder="실제" style="width:60px;padding:7px 6px;border:1px solid var(--gold-line);border-radius:5px;font-size:14px;text-align:center;font-family:inherit;background:var(--s1);font-weight:600">
      ${diffStr ? `<span style="font-size:11px;font-weight:700;color:${diffColor};flex-shrink:0;min-width:30px;text-align:center">${diffStr}</span>` : '<span style="min-width:30px"></span>'}
    </div>`;
  }).join('');

  const body = `
    <div style="font-size:11.5px;color:var(--t3);margin-bottom:10px;padding:8px 10px;background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:6px;line-height:1.5">
      📊 실제 재고 수량을 입력하세요. <b>적용</b>을 누르면 일괄 반영됩니다.<br>
      <span style="color:var(--t2)">취소하려면 닫기를 누르면 됩니다.</span>
    </div>
    <div class="search-wrap" style="margin-bottom:8px">
      <input type="text" id="sc_search" placeholder="제품명·품번 검색" oninput="window._scQuery=this.value;_renderStockCountModal()" autocomplete="off" value="${escapeHtml(window._scQuery||'')}">
    </div>
    <div style="display:flex;gap:8px;font-size:11px;color:var(--t3);margin-bottom:6px;padding:0 2px">
      <span>${list.length}개 표시</span>
      ${countedCount > 0 ? `<span style="color:var(--gold-lt);font-weight:600">· ${countedCount}개 카운트</span>` : ''}
      ${changeCount > 0 ? `<span style="color:var(--red);font-weight:600">· ${changeCount}개 변경 예정</span>` : ''}
    </div>
    <div style="max-height:55vh;overflow-y:auto;border:1px solid var(--bdr-lt);border-radius:6px;background:var(--s1)">${itemsHtml || '<div style="padding:40px 12px;text-align:center;color:var(--t3);font-size:12px">검색 결과 없음</div>'}</div>
    ${list.length > 100 ? `<div style="font-size:10.5px;color:var(--t3);text-align:center;margin-top:6px">↑ 100개까지 표시. 검색으로 좁혀 주세요.</div>` : ''}
    <div class="spacer"></div>
    <div style="display:flex;gap:8px">
      <button class="btn-secondary" onclick="window._scQuery='';closeModal()" style="flex:1">닫기</button>
      <button class="btn-primary" onclick="_applyStockCount()" style="flex:2" ${changeCount === 0 ? 'disabled' : ''}>적용 ${changeCount > 0 ? `(${changeCount})` : ''}</button>
    </div>
  `;
  openModal('📊 재고 카운트', body);
  // 검색 input에 포커스 복원
  setTimeout(()=>{
    const inp = document.getElementById('sc_search');
    if(inp && window._scQuery){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }, 30);
}

function _setStockCount(productId, value, prevStock){
  const v = value === '' ? null : (+value);
  if(v === null || isNaN(v)){
    delete _stockCountBuf[productId];
  } else {
    _stockCountBuf[productId] = {countedQty: v, prevStock: +prevStock||0};
  }
  // 가벼운 갱신만 — 모달 전체 재렌더 시 입력 포커스가 빠지므로
  // 변경된 행의 diff와 헤더 카운트만 업데이트
  _renderStockCountModal();
}

async function _applyStockCount(){
  const changes = Object.entries(_stockCountBuf).filter(([id, c]) => c.countedQty !== c.prevStock);
  if(!changes.length){
    showToast('⚠ 변경된 수량이 없습니다', 'warn');
    return;
  }
  if(!confirm(`${changes.length}개 제품의 재고를 변경합니다.\n계속하시겠습니까?`)) return;

  showToast(`🔄 ${changes.length}개 재고 업데이트 중...`, 'info');
  let success = 0, failed = 0;
  const today = todayStr();

  for(const [pidStr, c] of changes){
    const pid = +pidStr;
    const p = productDB.find(x => x.id === pid);
    if(!p) continue;
    p.stock = c.countedQty;
    // 재고 이력 기록 (stockHistory에 추가)
    if(typeof stockHistory !== 'undefined' && Array.isArray(stockHistory)){
      stockHistory.push({
        id: Date.now() + Math.random(),
        productId: pid,
        productName: p.name || '',
        productCode: p.code || '',
        type: '카운트',
        delta: c.countedQty - c.prevStock,
        before: c.prevStock,
        after: c.countedQty,
        memo: '모바일 재고 카운트',
        date: today,
        user: ''
      });
    }
    // 노션 동기화
    if(p._notionId && notionCfg && notionCfg.workerUrl){
      try {
        await nUpdate(p._notionId, {"재고수량": {number: c.countedQty}});
        success++;
      } catch(e){
        console.warn('재고 업데이트 실패:', p.code, e);
        failed++;
      }
    } else {
      success++;
    }
  }

  saveAll();
  _stockCountBuf = {};
  window._scQuery = '';
  closeModal();
  renderProdList();
  renderDash();
  if(failed > 0){
    showToast(`✓ ${success}개 완료 · ⚠ ${failed}개 노션 동기화 실패`, 'warn', 4000);
  } else {
    showToast(`✓ ${success}개 재고 업데이트 완료`, 'success', 3000);
  }
}

// 거래명세서 서브탭 상태 (draft / billing / done / all)
let _invSubTab = 'draft';
function setInvSubTab(tab){
  _invSubTab = tab;
  // 탭 버튼 활성화 표시 갱신
  document.querySelectorAll('#invSubTabs button').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.sub === tab);
  });
  renderInvList();
}

// 명세서 상태를 PC의 _invStage와 유사한 단계로 매핑
//   - draft:   작성중 / 발행완료 — 아직 청구 안 함 (단발 청구 대상)
//   - billing: 청구완료 / 미수 — 청구는 했고 입금 대기 (합본 대상)
//   - done:    입금완료 — 끝
function _getInvStage(v){
  const s = (v.status||'').trim();
  if(s === '입금완료') return 'done';
  if(s === '청구완료' || s === '미수') return 'billing';
  // 그 외(작성중, 발행완료, 미설정 등)는 draft
  return 'draft';
}

function renderInvList(){
  const q = (document.getElementById('invSearch')?.value||'').toLowerCase();
  let list = invoiceHistory.slice();
  if(q) list = list.filter(v=>(v.vendor||'').toLowerCase().includes(q) || (v.ordNo||'').toLowerCase().includes(q));

  // 탭별 카운트 계산 (필터 전 전체 기준)
  const counts = {draft:0, billing:0, done:0, all:list.length};
  list.forEach(v=>{
    const st = _getInvStage(v);
    counts[st] = (counts[st]||0) + 1;
  });
  const setCnt = (id, n)=>{ const el=document.getElementById(id); if(el) el.textContent = n; };
  setCnt('invCntDraft', counts.draft);
  setCnt('invCntBilling', counts.billing);
  setCnt('invCntDone', counts.done);
  setCnt('invCntAll', counts.all);

  // 서브탭 필터
  if(_invSubTab !== 'all'){
    list = list.filter(v => _getInvStage(v) === _invSubTab);
  }

  list.sort((a,b)=>(b.issuedAt||'').localeCompare(a.issuedAt||''));
  document.getElementById('invCnt').textContent = list.length;
  const el = document.getElementById('invList');
  if(!list.length){
    const emptyMsg = _invSubTab === 'draft' ? '미청구 명세서가 없습니다' :
                     _invSubTab === 'billing' ? '청구된 명세서가 없습니다' :
                     _invSubTab === 'done' ? '완료된 명세서가 없습니다' :
                     '명세서가 없습니다';
    el.innerHTML = `<div class="empty"><div class="icn">🧾</div>${emptyMsg}</div>`;
    return;
  }
  el.innerHTML = list.map(v=>{
    return `<div class="list-item" onclick="showInvDetail(${v.id})">
      <div class="li-h">
        ${initBadge(v.vendor)}
        <span class="li-vendor">${escapeHtml(getInitial(v.vendor)||'-')}</span>

<script>
// ════════════════════════════════════════════
// 사진 전체화면 라이트박스
// ════════════════════════════════════════════
let _lightboxImgs = [];
let _lightboxIdx = 0;

function openLightbox(imgs, idx){
  // imgs: 문자열 URL 배열 또는 {url, name} 객체 배열
  if(!imgs || !imgs.length) return;
  _lightboxImgs = imgs.map(im => {
    if(typeof im === 'string') return {url: im, name: ''};
    return {url: im.url || '', name: im.name || ''};
  }).filter(im => im.url);
  if(!_lightboxImgs.length) return;
  _lightboxIdx = Math.max(0, Math.min(idx||0, _lightboxImgs.length - 1));
  _renderLightbox();
  const lb = document.getElementById('lightbox');
  lb.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeLightbox(){
  const lb = document.getElementById('lightbox');
  lb.style.display = 'none';
  _lightboxImgs = [];
  // 모달이 떠있으면 modal의 overflow:hidden 유지, 아니면 해제
  if(!_activeModal) document.body.style.overflow = '';
}

function lightboxNav(delta){
  if(!_lightboxImgs.length) return;
  _lightboxIdx = (_lightboxIdx + delta + _lightboxImgs.length) % _lightboxImgs.length;
  _renderLightbox();
}

function _renderLightbox(){
  const cur = _lightboxImgs[_lightboxIdx];
  if(!cur) return;
  document.getElementById('lightbox_img').src = cur.url;
  document.getElementById('lightbox_counter').textContent =
    `${_lightboxIdx+1} / ${_lightboxImgs.length}`;
  document.getElementById('lightbox_caption').textContent = cur.name || '';
  // 1장이면 네비게이션 버튼 숨김
  const navShow = _lightboxImgs.length > 1 ? '' : 'none';
  document.getElementById('lightbox_prev').style.display = navShow;
  document.getElementById('lightbox_next').style.display = navShow;
}

// 라이트박스 안에서 좌우 스와이프(터치)로 넘기기
(function setupLightboxSwipe(){
  const lb = document.getElementById('lightbox');
  if(!lb) return;
  let startX = 0, startY = 0, moved = false;
  lb.addEventListener('touchstart', (e)=>{
    if(e.target.tagName === 'BUTTON') return;
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY; moved = false;
  }, {passive:true});
  lb.addEventListener('touchmove', ()=>{ moved = true; }, {passive:true});
  lb.addEventListener('touchend', (e)=>{
    if(!moved) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    // 좌우 스와이프 (수직보다 수평이 크고 충분히 길 때)
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
      lightboxNav(dx > 0 ? -1 : 1);
    }
    // 아래로 스와이프 → 닫기
    else if(dy > 80 && Math.abs(dy) > Math.abs(dx)){
      closeLightbox();
    }
  }, {passive:true});
  // 배경 클릭으로 닫기 (이미지 외 영역)
  lb.addEventListener('click', (e)=>{
    if(e.target === lb) closeLightbox();
  });
  // ESC 키로 닫기
  document.addEventListener('keydown', (e)=>{
    if(lb.style.display !== 'flex') return;
    if(e.key === 'Escape') closeLightbox();
    else if(e.key === 'ArrowLeft') lightboxNav(-1);
    else if(e.key === 'ArrowRight') lightboxNav(1);
  });
})();

// 사진 배열을 받아 onclick에 넣을 안전한 호출 문자열을 생성
//   imgs: [{url, name}] 또는 [string] 또는 mixed
function _lightboxOnclick(imgs, idx){
  // imgs를 JSON으로 시리얼라이즈해서 onclick에 넣음 (작은따옴표 escape)
  const safe = JSON.stringify(imgs.map(im => typeof im === 'string' ? {url:im, name:''} : {url:im.url||'', name:im.name||''}))
    .replace(/"/g, '&quot;');
  return `event.stopPropagation();openLightbox(JSON.parse(this.dataset.imgs), ${idx})`;
}

// ════════════════════════════════════════════
// 사진 업로드 (camera input + R2)
// ════════════════════════════════════════════
async function readFileAsDataURL(file){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
    r.readAsDataURL(file);
  });
}

// 이미지 압축 (큰 파일은 자동 축소)
async function compressImage(dataUrl, maxSize){
  maxSize = maxSize || 1200;
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = ()=>{
      let w=img.width, h=img.height;
      if(w>maxSize || h>maxSize){
        if(w>h){ h=Math.round(h*maxSize/w); w=maxSize; }
        else { w=Math.round(w*maxSize/h); h=maxSize; }
      }
      const cv = document.createElement('canvas');
      cv.width=w; cv.height=h;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      res(cv.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = rej;
    img.src = dataUrl;
  });
}

// R2 업로드 (PC와 동일 워커 사용)
async function uploadImageToR2(file){
  if(!notionCfg || !notionCfg.workerUrl) return null;
  const dataUrl = await readFileAsDataURL(file);
  let processed = dataUrl;
  if(file.type.startsWith('image/')){
    try{ processed = await compressImage(dataUrl, 1200); }catch(e){ console.warn('압축 실패:', e); }
  }
  // workerUrl/r2/upload
  const url = notionCfg.workerUrl.replace(/\/+$/,'') + '/r2/upload';
  const headers = {'Content-Type':'application/json'};
  if(notionCfg.token) headers['Authorization'] = 'Bearer '+notionCfg.token;
  const fname = `${Date.now()}_${file.name||'img.jpg'}`;
  try{
    const r = await fetch(url, {method:'POST', headers, body:JSON.stringify({
      filename: fname,
      contentType: file.type||'image/jpeg',
      data: processed.split(',')[1]
    })});
    const j = await r.json();
    if(j && j.url){
      return {name:file.name||'사진', url:j.url, type:file.type||'image/jpeg', r2Key:j.key||''};
    }
  }catch(e){
    console.warn('R2 업로드 실패:', e);
  }
  // 폴백 — base64 그대로 (로컬에만)
  return {name:file.name||'사진', url:processed, type:file.type||'image/jpeg'};
}

// 사진 입력 위젯 (모달 안에 삽입용)
// 모바일에서 카메라 촬영과 갤러리 선택 둘 다 가능하도록 버튼을 두 개로 분리
//   - 촬영 버튼:  capture="environment" → 카메라 바로 열림 (후면)
//   - 갤러리 버튼: capture 없음        → 운영체제 기본 파일 선택기 (사진 라이브러리)
function photoWidget(id, files){
  files = files || [];
  return `
    <div class="photo-grid" id="${id}_grid">
      ${files.map((f,i)=>`<div class="photo-item">
        <img src="${f.url}" alt="" onclick="openLightbox(_photoGet('${id}'), ${i})">
        <div class="rm" onclick="_photoRemove('${id}',${i})">✕</div>
      </div>`).join('')}
      <label class="photo-add" for="${id}_cam">
        <span class="ico">📷</span>
        <span>촬영</span>
      </label>
      <label class="photo-add" for="${id}_gal">
        <span class="ico">🖼</span>
        <span>갤러리</span>
      </label>
      <input type="file" id="${id}_cam" accept="image/*" capture="environment" style="display:none" onchange="_photoAdd('${id}',event)">
      <input type="file" id="${id}_gal" accept="image/*" multiple style="display:none" onchange="_photoAdd('${id}',event)">
    </div>
  `;
}
window._photoBufs = window._photoBufs || {};
function _photoInit(id, files){ window._photoBufs[id] = (files||[]).map(f=>({...f})); }
function _photoGet(id){ return window._photoBufs[id] || []; }
function _photoRemove(id, idx){
  window._photoBufs[id].splice(idx, 1);
  _photoRefresh(id);
}
async function _photoAdd(id, ev){
  const files = Array.from(ev.target.files||[]);
  if(!files.length) return;
  ev.target.value = '';
  showToast(`📷 ${files.length}장 업로드 중...`, 'info');
  for(const f of files){
    const uploaded = await uploadImageToR2(f);
    if(uploaded) window._photoBufs[id].push(uploaded);
  }
  _photoRefresh(id);
  showToast('✓ 사진 추가됨', 'success');
}
function _photoRefresh(id){
  const grid = document.getElementById(id+'_grid');
  if(!grid) return;
  const files = _photoGet(id);
  grid.innerHTML = `${files.map((f,i)=>`<div class="photo-item">
    <img src="${f.url}" alt="" onclick="openLightbox(_photoGet('${id}'), ${i})">
    <div class="rm" onclick="_photoRemove('${id}',${i})">✕</div>
  </div>`).join('')}
  <label class="photo-add" for="${id}_cam">
    <span class="ico">📷</span>
    <span>촬영</span>
  </label>
  <label class="photo-add" for="${id}_gal">
    <span class="ico">🖼</span>
    <span>갤러리</span>
  </label>
  <input type="file" id="${id}_cam" accept="image/*" capture="environment" style="display:none" onchange="_photoAdd('${id}',event)">
  <input type="file" id="${id}_gal" accept="image/*" multiple style="display:none" onchange="_photoAdd('${id}',event)">`;
}

// ════════════════════════════════════════════
// 발주 상세 + 상태 변경
// ════════════════════════════════════════════
// ──── 발주 행별 입고 처리 (검품 시 모바일로 바로 기록) ────
// rcvHistory: [{date, qty, note}] 형식으로 누적 입고 이력 저장 (PC와 동일)
// 데이터는 r.rcvHistory에 저장되고, 노션의 품목상세JSON 필드를 통해 동기화됨
const _expandedRcvRows = new Set(); // 입고 행 펼침/접힘 상태

function _toggleRcvRow(key){
  if(_expandedRcvRows.has(key)) _expandedRcvRows.delete(key);
  else _expandedRcvRows.add(key);
  // 현재 열려있는 발주 상세 모달만 다시 렌더링
  const ordId = parseInt(key.split('_')[0]);
  showOrdDetail(ordId);
}

async function _addRcv(ordId, rowIdx){
  const inp = document.getElementById(`rcv_new_${ordId}_${rowIdx}`);
  const qty = +(inp?.value||0);
  if(qty <= 0){
    showToast('⚠ 입고 수량을 입력해 주세요', 'warn');
    return;
  }
  const o = orders.find(x=>x.id==ordId);
  if(!o || !o.rows || !o.rows[rowIdx]) return;
  const r = o.rows[rowIdx];
  const ordQty = parseQty(r.qty)||0;
  const curTotal = (r.rcvHistory||[]).reduce((s,h)=>s+(+h.qty||0),0);
  // 잔량 초과 경고 (강제 차단 안 함 — 가끔 더 많이 들어올 수도 있음)
  if(ordQty > 0 && curTotal + qty > ordQty){
    if(!confirm(`잔량(${ordQty - curTotal}개)보다 많습니다.\n${qty}개를 입고로 기록하시겠습니까?`)) return;
  }
  // 입고 이력 추가
  if(!r.rcvHistory) r.rcvHistory = [];
  r.rcvHistory.push({
    date: todayStr(),
    qty: qty,
    note: ''
  });
  // 발주서 전체 입고 완료되었는지 체크 (모든 행이 발주량 이상이면)
  const allDone = (o.rows||[]).every(row => {
    const oq = parseQty(row.qty)||0;
    const rt = (row.rcvHistory||[]).reduce((s,h)=>s+(+h.qty||0),0);
    return oq > 0 && rt >= oq;
  });
  // 모두 완료면 상태도 '출고완료'로 자동 변경 (사용자 확인 필요)
  let autoComplete = false;
  if(allDone && o.status !== '출고완료'){
    autoComplete = confirm('모든 품목이 전량 입고되었습니다.\n발주 상태를 "출고완료"로 변경할까요?');
    if(autoComplete) o.status = '출고완료';
  }

  saveAll();
  showToast(`✓ ${qty}개 입고 기록`, 'success');

  // 노션 동기화 (백그라운드)
  if(o._notionId && notionCfg && notionCfg.workerUrl){
    try {
      const props = {
        "품목상세JSON": {rich_text:[{text:{content: JSON.stringify(o.rows||[]).slice(0,2000)}}]}
      };
      if(autoComplete) props["상태"] = {select:{name:'출고완료'}};
      await nUpdate(o._notionId, props);
    } catch(e){
      console.warn('입고 노션 동기화 실패:', e);
      showToast('로컬에 저장됨 (노션 동기화 실패)', 'warn');
    }
  }

  // 모달 다시 그리기 (펼친 상태 유지)
  _expandedRcvRows.add(`${ordId}_${rowIdx}`);
  showOrdDetail(ordId);
  renderOrdList();
  renderDash();
}

async function _updateRcvHist(ordId, rowIdx, histIdx, field, value){
  const o = orders.find(x=>x.id==ordId);
  if(!o || !o.rows || !o.rows[rowIdx]) return;
  const h = o.rows[rowIdx].rcvHistory?.[histIdx];
  if(!h) return;
  if(field === 'qty') h.qty = +value || 0;
  else if(field === 'date') h.date = value;
  else h[field] = value;
  saveAll();
  // 노션 동기화 (디바운스 없이 즉시 — 자주 일어나지 않으므로)
  if(o._notionId && notionCfg && notionCfg.workerUrl){
    try {
      await nUpdate(o._notionId, {
        "품목상세JSON": {rich_text:[{text:{content: JSON.stringify(o.rows||[]).slice(0,2000)}}]}
      });
    } catch(e){ console.warn('입고 수정 노션 동기화 실패:', e); }
  }
  _expandedRcvRows.add(`${ordId}_${rowIdx}`);
  showOrdDetail(ordId);
}

async function _removeRcvHist(ordId, rowIdx, histIdx){
  if(!confirm('이 입고 기록을 삭제하시겠습니까?')) return;
  const o = orders.find(x=>x.id==ordId);
  if(!o || !o.rows || !o.rows[rowIdx]) return;
  const r = o.rows[rowIdx];
  if(!r.rcvHistory) return;
  r.rcvHistory.splice(histIdx, 1);
  saveAll();
  showToast('✓ 입고 기록 삭제됨', 'success');
  if(o._notionId && notionCfg && notionCfg.workerUrl){
    try {
      await nUpdate(o._notionId, {
        "품목상세JSON": {rich_text:[{text:{content: JSON.stringify(o.rows||[]).slice(0,2000)}}]}
      });
    } catch(e){ console.warn('입고 삭제 노션 동기화 실패:', e); }
  }
  _expandedRcvRows.add(`${ordId}_${rowIdx}`);
  showOrdDetail(ordId);
  renderOrdList();
}

async function _shareOrdPdf(ordId){
  const o = orders.find(x=>x.id==ordId);
  if(!o) return;
  const paper = document.getElementById('ordPdfPaper');
  if(!paper){ showToast('⚠ 발주서 화면을 찾을 수 없습니다', 'warn'); return; }

  // 1) html2canvas 동적 로드 (필요 시)
  if(typeof html2canvas === 'undefined'){
    showToast('🔄 이미지 변환 라이브러리 로딩...', 'info', 2000);
    try {
      await new Promise((res, rej)=>{
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
        s.onload = res;
        s.onerror = ()=>rej(new Error('로딩 실패'));
        document.head.appendChild(s);
      });
    } catch(e){
      // 라이브러리 로드 실패 → 폴백: 텍스트 공유
      _shareOrdAsText(o);
      return;
    }
  }

  // 2) 페이퍼를 캔버스로 변환 → 이미지
  showToast('🔄 이미지 생성 중...', 'info', 2000);
  try {
    const canvas = await html2canvas(paper, {
      backgroundColor: '#ffffff',
      scale: 2, // 해상도 2배
      useCORS: true,
      logging: false
    });
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png', 0.95));
    if(!blob){ throw new Error('이미지 생성 실패'); }

    const filename = `발주서_${o.vendor||'발주'}_${(o.no||todayStr()).replace(/[^a-zA-Z0-9가-힣_-]/g,'_')}.png`;
    const file = new File([blob], filename, {type: 'image/png'});

    // 3) Web Share API 사용 가능 시 시스템 공유 시트
    if(navigator.canShare && navigator.canShare({files: [file]})){
      try {
        await navigator.share({
          files: [file],
          title: `발주서 - ${o.vendor||''}`,
          text: `발주번호: ${o.no||''}\n출고요청일: ${o.ship||''}`
        });
        showToast('✓ 공유 완료', 'success');
        return;
      } catch(e){
        if(e.name === 'AbortError') return; // 사용자가 취소
        console.warn('Web Share 실패, 폴백:', e);
      }
    }

    // 4) 폴백: 이미지를 새 탭에서 열거나 다운로드
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    showToast('✓ 이미지 저장됨', 'success');
  } catch(e){
    console.error('이미지 변환 실패:', e);
    _shareOrdAsText(o);
  }
}

// 폴백: 이미지 변환 실패 시 텍스트로 공유
function _shareOrdAsText(o){
  const lines = [
    `📄 발주서`,
    `수신: ${o.vendor||''}`,
    `발주번호: ${o.no||''}`,
    `발주일자: ${o.date||''}`,
    `출고요청: ${o.ship||''}`,
    o.factShip ? `공장출고: ${o.factShip}` : '',
    '',
    '품목:',
    ...(o.rows||[]).map((r,i)=>{
      const parts = [];
      if(r.itemCode) parts.push(r.itemCode);
      parts.push(r.name||'-');
      if(r.mat) parts.push(r.mat);
      if(r.plating) parts.push(r.plating);
      if(r.size) parts.push(r.size);
      return `${i+1}. ${parts.join(' / ')}  ${parseQty(r.qty)||0}개`;
    })
  ].filter(Boolean).join('\n');

  if(navigator.share){
    navigator.share({title: `발주서 - ${o.vendor||''}`, text: lines})
      .then(()=>showToast('✓ 공유 완료', 'success'))
      .catch(e=>{ if(e.name !== 'AbortError') _copyText(lines); });
  } else {
    _copyText(lines);
  }
}

function _copyText(text){
  if(navigator.clipboard){
    navigator.clipboard.writeText(text)
      .then(()=>showToast('✓ 클립보드에 복사됨', 'success'))
      .catch(()=>showToast('⚠ 복사 실패', 'warn'));
  } else {
    showToast('⚠ 공유 불가 — 화면을 캡처해서 사용하세요', 'warn', 4000);
  }
}

function showOrdDetail(id){
  const o = orders.find(x=>x.id==id);
  if(!o) return;
  const st = o.status||'진행중';

  const ddHtml = dd && !isDone ? `<span class="dday ${dd.cls}" style="margin-left:6px">${dd.t}</span>` : '';
  const stCls = st==='출고완료'?'s-done':st==='취소'?'s-cancel':st==='보류'?'s-hold':st==='제작중'?'s-make':st==='수정중'?'s-fix':'s-prog';

  // 발주 행 렌더링 + 입고 처리 UI
  // rcvHistory: [{date, qty, note}] 형식으로 누적 입고 이력 저장 (PC와 동일)

    const img = r.img || '';
    const imgClick = img ? `onclick='openLightbox([{url:"${img}",name:${JSON.stringify(r.name||"")}}], 0)'` : '';
    const ordQty = parseQty(r.qty)||0;
    const hist = r.rcvHistory||[];
    const rcvTotal = hist.reduce((s,h)=>s+(+h.qty||0),0);
    const remain = Math.max(ordQty - rcvTotal, 0);
    const pct = ordQty > 0 ? Math.min(Math.round(rcvTotal/ordQty*100), 100) : 0;
    const isRowDone = ordQty > 0 && rcvTotal >= ordQty;
    const barColor = isRowDone ? 'var(--grn)' : pct >= 50 ? 'var(--gold-lt)' : 'var(--org)';
    const isExpanded = _expandedRcvRows.has(`${o.id}_${i}`);

    // 입고 현황 박스 (발주 수량 있을 때만)
    let rcvHtml = '';
    if(ordQty > 0){
      // 입고 이력 (확장 시)
      const histHtml = isExpanded && hist.length ? `
        <div style="display:flex;flex-direction:column;gap:4px;margin-top:8px">
          ${hist.map((h,j)=>`
            <div style="display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--s1);border:1px solid var(--bdr-lt);border-radius:5px;font-size:11.5px">
              <span style="color:var(--t3);flex-shrink:0">📅</span>
              <input type="date" value="${h.date||''}" onchange="_updateRcvHist(${o.id},${i},${j},'date',this.value)" style="border:none;background:none;font-size:11.5px;color:var(--t1);font-family:inherit;padding:0;width:120px">
              <input type="number" inputmode="numeric" value="${h.qty||''}" min="1" onchange="_updateRcvHist(${o.id},${i},${j},'qty',this.value)" placeholder="수량" style="width:60px;padding:3px 6px;border:1px solid var(--bdr-lt);border-radius:4px;font-size:12px;text-align:center;font-family:inherit;background:var(--s1)">
              <span style="font-size:10px;color:var(--t3);flex-shrink:0">개</span>
              <button onclick="_removeRcvHist(${o.id},${i},${j})" style="background:none;border:none;color:var(--t3);cursor:pointer;font-size:14px;padding:0 4px;line-height:1;flex-shrink:0">✕</button>
            </div>
          `).join('')}
        </div>
      ` : '';

      // 추가 입력 영역 (확장 시 + 미완료일 때)
      const addHtml = isExpanded && !isRowDone ? `
        <div style="display:flex;gap:6px;margin-top:8px;align-items:center">
          <input type="number" inputmode="numeric" id="rcv_new_${o.id}_${i}" placeholder="입고 수량" min="1" max="${remain}" style="flex:1;padding:7px 10px;border:1px solid var(--gold-line);border-radius:5px;font-size:13px;font-family:inherit;background:var(--s1)">

        </div>
        <div style="font-size:10.5px;color:var(--t3);margin-top:4px;text-align:right">잔량: ${remain.toLocaleString()}개</div>

      rcvHtml = `
        <div style="margin-top:8px;padding:7px 9px;background:${isRowDone?'rgba(74,128,80,.08)':'var(--s2)'};border-radius:6px;border:1px solid ${isRowDone?'rgba(74,128,80,.25)':'var(--bdr-lt)'}">
          <div onclick="_toggleRcvRow('${o.id}_${i}')" style="display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none">
            <span style="font-size:10px;color:var(--t3);flex-shrink:0;transition:transform .2s;transform:rotate(${isExpanded?'90':'0'}deg)">▶</span>
            <span style="font-size:10px;color:var(--t3);font-weight:700;flex-shrink:0">📦</span>
            <div style="flex:1;height:5px;background:var(--s3);border-radius:3px;overflow:hidden">
              <div style="width:${pct}%;height:100%;background:${barColor};border-radius:3px;transition:.3s"></div>
            </div>
            <span style="font-size:11px;font-weight:700;flex-shrink:0;color:${isRowDone?'var(--grn)':remain>0?'var(--org)':'var(--t1)'}">${isRowDone?'✓ 완료':rcvTotal+'/'+ordQty}</span>

  // 첨부 파일 (사진만 골라서 갤러리로 표시)

async function saveOrdEdit(ordId){
  const i = orders.findIndex(x=>x.id==ordId);
  if(i < 0) return;
  const o = orders[i];
  const updated = {
    ...o,
    status: document.getElementById('ord_status').value,
    ship: document.getElementById('ord_ship').value,
    factShip: document.getElementById('ord_factShip').value,
    date: document.getElementById('ord_date').value,
    memo: document.getElementById('ord_memo').value.trim(),
    factoryNotice: document.getElementById('ord_factoryNotice').value.trim(),
    rows: window._ordEditRows || o.rows
  };

  if(o._notionId && notionCfg && notionCfg.workerUrl){
    showToast('🔄 노션 수정 중...','info');
    try{
      const props = {
        "상태":{select:{name:updated.status}},
        "메모":{rich_text:[{text:{content:updated.memo||''}}]},
        "공장주의사항":{rich_text:[{text:{content:updated.factoryNotice||''}}]},

async function adjustProdStock(prodId, delta){
  const i = productDB.findIndex(x=>x.id==prodId);
  if(i < 0) return;
  const p = productDB[i];
  const prevStock = +p.stock||0;
  const newStock = Math.max(0, prevStock + delta);
  p.stock = newStock;
  // 화면 즉시 업데이트
  const el = document.getElementById(`prod_stock_${prodId}`);
  if(el) el.textContent = newStock;
  // 이력 기록
  stockHistory.push({
    id: Date.now()+Math.floor(Math.random()*1000),
    productId: p.id,
    productName: p.name||'',
    productCode: p.code||'',
    delta, prevStock, newStock,
    type: delta>0 ? 'manual_in' : 'manual_out',
    note: '모바일에서 조정',
    when: new Date().toISOString(),
    by: 'mobile'
  });
  saveAll();

  // 노션 동기화
  if(p._notionId && notionCfg && notionCfg.workerUrl){
    try{
      await nUpdate(p._notionId, {"재고수량":{number:newStock}});
    }catch(e){
      console.warn('노션 재고 동기화 실패:', e);
    }
  }
  renderProdList();
  renderDash();
}

function openProdStockSet(prodId){
  const p = productDB.find(x=>x.id==prodId);
  if(!p) return;
  const cur = +p.stock||0;
  const newVal = prompt(`현재 재고: ${cur}\n새 재고 수량을 입력하세요:`, cur);
  if(newVal === null) return;
  const n = parseInt(newVal, 10);
  if(isNaN(n) || n < 0){ showToast('숫자만 입력해주세요','warn'); return; }
  const delta = n - cur;
  if(delta !== 0) adjustProdStock(prodId, delta);
}

    try{
      const props = {
        "품목코드":{title:[{text:{content:updated.code}}]},
        "품목명":{rich_text:[{text:{content:updated.name}}]},
        "소재":{select:{name:updated.mat||''}},
        "규격":{rich_text:[{text:{content:updated.size||''}}]},
        "출고단가":{number:updated.price||0},
        "입고단가":{number:updated.costPrice||0},
        "재고수량":{number:updated.stock||0},
        "안전재고":{number:updated.safetyStock||0},
        "메모":{rich_text:[{text:{content:updated.memo||''}}]},
        "이미지JSON":{rich_text:[{text:{content:JSON.stringify(updated.imgs||[]).slice(0,2000)}}]}
      };
      if(updated.type) props["유형"] = {select:{name:updated.type}};
      if(updated.plating) props["도금"] = {select:{name:updated.plating}};
      await nUpdate(old._notionId, props);
      showToast('✓ 수정 완료','success');
    }catch(e){
      console.error(e);
      showToast('로컬에만 저장됨','warn');
    }
  } else {
    showToast('✓ 수정됨 (로컬)','success');
  }

  productDB[i] = updated;
  saveAll();
  closeModal();
  renderProdList();
  renderDash();
}

// ════════════════════════════════════════════
// AS 상세
// ════════════════════════════════════════════
function showAsDetail(id){
  const a = asItems.find(x=>x.id==id);
  if(!a) return;
  const st = a.status||'접수';
  const stCls = st==='완료'?'s-done':st==='반송'?'s-cancel':st==='수리중'?'s-make':'s-prog';

  const repairs = a.repairs && a.repairs.length ? a.repairs : [{reason:a.desc||'', qty:+a.qty||1, unitCost:+a.unitCost||0}];
  const subtotal = repairs.reduce((s,r)=>s+(+r.qty||0)*(+r.unitCost||0), 0);
  const shipping = +a.shippingFee||0;
  const vat = a.vatIncluded ? Math.round((subtotal+shipping)*0.1) : 0;
  const total = subtotal + shipping + vat;
  const totalQty = repairs.reduce((s,r)=>s+(+r.qty||0), 0);

  const repairsHtml = repairs.length>1 ? repairs.map((r,i)=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bdr-lt);font-size:12px">
    <span>${i+1}. ${escapeHtml(r.reason||'-')} ×${r.qty||0}</span>
    <span style="font-weight:600">₩${((+r.qty||0)*(+r.unitCost||0)).toLocaleString()}</span>
  </div>`).join('') : '';

  // 사진 — 라이트박스로 전체화면 보기
  const imgs = (a.files||[]).filter(f=>f && f.url);
  const imgsData = imgs.map(f => ({url:f.url, name:f.name||''}));
  const imgsJson = JSON.stringify(imgsData).replace(/'/g, '&#39;');
  const imgHtml = imgs.length ? `<div style="margin:14px 0"><div style="font-size:11.5px;font-weight:700;color:var(--t3);margin-bottom:6px">📷 사진 (${imgs.length})</div><div class="photo-grid" data-imgs='${imgsJson}'>${imgs.map((im,i)=>`<div class="photo-item"><img src="${im.url}" alt="" onclick="openLightbox(JSON.parse(this.closest('.photo-grid').dataset.imgs), ${i})"></div>`).join('')}</div></div>` : '';

  let actHtml = '';
  if(st !== '완료'){
    actHtml = `<div class="act-row">
      <button class="act-btn success" onclick="changeAsStatus(${a.id},'완료')">✓ 완료</button>
      <button class="act-btn" onclick="changeAsStatus(${a.id},'수리중')">⚙ 수리중</button>
    </div>`;
  } else {
    actHtml = `<div class="act-row"><button class="act-btn" onclick="changeAsStatus(${a.id},'접수')">↺ 접수로 되돌리기</button></div>`;
  }

  const body = `
    <div class="dt-row"><span class="l">품목</span><span class="v bold">${escapeHtml(a.item||'-')}</span></div>
    <div class="dt-row"><span class="l">고객사</span><span class="v">${escapeHtml(a.client||'-')}</span></div>
    <div class="dt-row"><span class="l">상태</span><span class="v"><span class="li-status ${stCls}">${st}</span></span></div>
    <div class="dt-row"><span class="l">접수일</span><span class="v">${escapeHtml(a.date||'-')}</span></div>
    <div class="dt-row"><span class="l">완료예정일</span><span class="v">${escapeHtml(a.due||'-')}</span></div>
    <div class="dt-row"><span class="l">총 수량</span><span class="v bold">${totalQty}개</span></div>
    ${repairsHtml ? `<div style="margin-top:12px;padding:10px;background:var(--s2);border-radius:7px"><div style="font-size:11px;font-weight:700;color:var(--t3);margin-bottom:6px">🔧 수리 내역</div>${repairsHtml}</div>` : ''}
    <div style="margin-top:10px;padding:10px;background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:7px">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--t2)"><span>수리 소계</span><span>₩${subtotal.toLocaleString()}</span></div>
      ${shipping>0?`<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--t2)"><span>+ 물류비</span><span>₩${shipping.toLocaleString()}</span></div>`:''}
      ${vat>0?`<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--t2)"><span>+ 부가세 (10%)</span><span>₩${vat.toLocaleString()}</span></div>`:''}
      <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--gold-lt);border-top:1px solid var(--gold-line);margin-top:6px;padding-top:6px"><span>합계</span><span>₩${total.toLocaleString()}</span></div>
    </div>
    ${a.desc?`<div style="margin-top:12px;padding:10px 12px;background:var(--s2);border-radius:7px;font-size:12px;color:var(--t2);white-space:pre-wrap">${escapeHtml(a.desc)}</div>`:''}
    ${imgHtml}
    ${actHtml}
  `;
  openModal('🔧 AS 상세 — '+escapeHtml(a.item||''), body, null, `<button class="edit" onclick="openAsEdit(${a.id})">✎ 편집</button>`);
}

async function changeAsStatus(asId, newStatus){
  const a = asItems.find(x=>x.id==asId);
  if(!a) return;
  if(!confirm(`상태를 "${newStatus}"(으)로 변경할까요?`)) return;
  a.status = newStatus;
  saveAll();
  if(a._notionId && notionCfg && notionCfg.workerUrl){
    showToast('🔄 동기화 중...', 'info');
    try{
      await nUpdate(a._notionId, {"진행상태":{select:{name:newStatus}}});
      showToast('✓ 변경 완료', 'success');
    }catch(e){
      showToast('로컬만 저장됨', 'warn');
    }
  } else {
    showToast('✓ 변경 완료', 'success');
  }
  closeModal();
  renderAsList();
}

// 입출고 상세

function showIoDetail(id){
  const io = ioItems.find(x=>x.id==id);
  if(!io) return;
  const imgs = (io.files||[]).filter(f=>f && f.url);
  const imgsData = imgs.map(f => ({url:f.url, name:f.name||''}));
  const imgsJson = JSON.stringify(imgsData).replace(/'/g, '&#39;');
  const imgHtml = imgs.length ? `<div style="margin:14px 0"><div style="font-size:11.5px;font-weight:700;color:var(--t3);margin-bottom:6px">📷 사진 (${imgs.length})</div><div class="photo-grid" data-imgs='${imgsJson}'>${imgs.map((im,i)=>`<div class="photo-item"><img src="${im.url}" alt="" onclick="openLightbox(JSON.parse(this.closest('.photo-grid').dataset.imgs), ${i})"></div>`).join('')}</div></div>` : '';
  const body = `
    <div class="dt-row"><span class="l">제목</span><span class="v bold">${escapeHtml(io.title||io.vendor||'-')}</span></div>
    <div class="dt-row"><span class="l">일자</span><span class="v">${escapeHtml(io.date||'-')}</span></div>
    <div class="dt-row"><span class="l">구분</span><span class="v"><span class="li-status ${io.kind==='출고'?'s-fix':'s-make'}">${io.kind||'-'}</span></span></div>
    <div class="dt-row"><span class="l">흐름</span><span class="v">${escapeHtml(io.flow||'-')}</span></div>
    <div class="dt-row"><span class="l">고객사/공장</span><span class="v">${escapeHtml(io.vendor||'-')}</span></div>
    <div class="dt-row"><span class="l">수량</span><span class="v">${io.qty?(+io.qty).toLocaleString()+'개':'-'}</span></div>
    <div class="dt-row"><span class="l">송장번호</span><span class="v">${escapeHtml(io.invoice||'-')}</span></div>
    <div class="dt-row"><span class="l">등록자</span><span class="v">${escapeHtml(io.user||'-')}</span></div>
    ${io.items?`<div style="margin-top:12px;padding:10px 12px;background:var(--s2);border-radius:7px;font-size:12.5px;color:var(--t1);font-weight:500"><span style="font-size:10.5px;color:var(--t3);font-weight:700">품목</span><br>${escapeHtml(io.items)}</div>`:''}
    ${io.memo?`<div style="margin-top:8px;padding:10px 12px;background:var(--s2);border-radius:7px;font-size:12px;color:var(--t2);white-space:pre-wrap">${escapeHtml(io.memo)}</div>`:''}
    ${imgHtml}
  `;
  openModal('🚚 입출고 상세', body, null, `<button class="edit" onclick="openIoEdit(${io.id})">✎ 편집</button>`);
}

// 명세서 상세

function showInvDetail(id){
  const v = invoiceHistory.find(x=>x.id==id);
  if(!v) return;
  const itemsHtml = (v.items||[]).map((it,i)=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bdr-lt);font-size:12px">
    <div style="flex:1;min-width:0">
      <div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i+1}. ${escapeHtml(it.name||'-')}</div>
      ${it.code?`<div style="font-size:10.5px;color:var(--t3);font-family:monospace">${escapeHtml(it.code)}</div>`:''}
    </div>
    <div style="text-align:right;flex-shrink:0;margin-left:8px">
      <div>${it.qty||0}개 × ₩${(+it.unit||0).toLocaleString()}</div>
      <div style="font-weight:600;color:var(--gold-lt)">₩${(+it.amt||0).toLocaleString()}</div>
    </div>
  </div>`).join('');
  const body = `
    <div class="dt-row"><span class="l">고객사</span><span class="v bold">${escapeHtml(v.vendor||'-')}</span></div>
    <div class="dt-row"><span class="l">발주번호</span><span class="v" style="font-family:monospace">${escapeHtml(v.ordNo||'-')}</span></div>
    <div class="dt-row"><span class="l">발행일</span><span class="v">${escapeHtml(v.issuedAt||'-')}</span></div>
    <div class="dt-row"><span class="l">출고일</span><span class="v">${escapeHtml(v.shipDate||'-')}</span></div>
    <div class="dt-row"><span class="l">상태</span><span class="v">${escapeHtml(v.status||'-')}</span></div>
    ${(v.items||[]).length ? `<div style="margin-top:14px"><div style="font-size:11px;font-weight:700;color:var(--t3);margin-bottom:6px">품목 (${(v.items||[]).length}개)</div>${itemsHtml}</div>` : ''}
    <div style="margin-top:14px;padding:10px;background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:7px">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--t2)"><span>공급가액</span><span>₩${(+v.supplyAmt||0).toLocaleString()}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--t2)"><span>부가세 (10%)</span><span>₩${(+v.tax||0).toLocaleString()}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;color:var(--gold-lt);border-top:1px solid var(--gold-line);margin-top:6px;padding-top:6px"><span>합계</span><span>₩${(+v.total||0).toLocaleString()}</span></div>
    </div>
  `;
  openModal('🧾 거래명세서 — '+escapeHtml(v.vendor||''), body);
}

</script>
<script>
// ════════════════════════════════════════════
// 등록 폼들 — 샘플 / 입출고 / AS
// ════════════════════════════════════════════

const todayStr = () => toLocalDateStr(new Date());

// ──── 샘플 등록/편집 (통합) ────
function openSmpAdd(){ openSmpForm(null); }
function openSmpEdit(smpId){ openSmpForm(smpId); }

function openSmpForm(smpId){
  const s = smpId ? samples.find(x=>x.id==smpId) : null;
  const isEdit = !!s;
  _photoInit('smpAdd', s ? (s.imgs||[]) : []);
  const v = (k, def='') => s ? (s[k] != null && s[k] !== '' ? s[k] : def) : def;
  const selOpt = (cur, opts) => opts.map(o => `<option value="${o}" ${cur===o?'selected':''}>${o}</option>`).join('');
  const platings = ['','골드','실버','로즈골드','로듐','14k 골드','14K 골드 / 로듐','블랙','실버버니쉬','무도금'];
  const types = ['EARRING','RING','NECKLACE','BRACELET','BROOCH','기타'];
  const statuses = ['의뢰','제작중','수정중','완료','취소'];
  const curType = v('type') || 'RING';
  const curPlating = v('plating') || '';
  const curStatus = v('status') || '의뢰';
  const body = `
    <div class="form-r">
      <label>샘플명<span class="req">*</span></label>
      <input type="text" id="smp_name" placeholder="예: 크리스탈반지" value="${escapeHtml(v('name'))}">
    </div>
    <div class="form-r-2">
      <div class="form-r" style="margin:0"><label>유형</label>
        <select id="smp_type">${selOpt(curType, types)}</select>
      </div>
      <div class="form-r" style="margin:0"><label>상태</label>
        <select id="smp_status">${selOpt(curStatus, statuses)}</select>
      </div>
    </div>
    <div class="form-r">
      <label>담당자/업체</label>
      <input type="text" id="smp_manager" placeholder="고객사명" value="${escapeHtml(v('manager'))}">
    </div>
    <div class="form-r-2">
      <div class="form-r" style="margin:0"><label>의뢰일</label>
        <input type="date" id="smp_reqDate" value="${v('reqDate') || todayStr()}">
      </div>
      <div class="form-r" style="margin:0"><label>납기일<span class="req">*</span></label>
        <input type="date" id="smp_due" value="${v('due')}">
      </div>
    </div>
    <div class="form-r">
      <label>공장출고일</label>
      <input type="date" id="smp_factShip" value="${v('factShip')}">
    </div>
    <div class="form-r-2">
      <div class="form-r" style="margin:0"><label>소재</label>
        <input type="text" id="smp_mat" placeholder="예: 925실버" value="${escapeHtml(v('mat'))}">
      </div>
      <div class="form-r" style="margin:0"><label>도금</label>
        <select id="smp_plating">${selOpt(curPlating, platings)}</select>
      </div>
    </div>
    <div class="form-r-3">
      <div class="form-r" style="margin:0"><label>외경/길이</label>
        <input type="text" id="smp_sz1" placeholder="11mm" value="${escapeHtml(v('sz1'))}">
      </div>
      <div class="form-r" style="margin:0"><label>호수</label>
        <input type="text" id="smp_sz2" placeholder="13호" value="${escapeHtml(v('sz2'))}">
      </div>
      <div class="form-r" style="margin:0"><label>중량</label>
        <input type="text" id="smp_wt" placeholder="2g" value="${escapeHtml(v('wt'))}">
      </div>
    </div>
    <div class="form-r">
      <label>품번</label>
      <input type="text" id="smp_itemCode" placeholder="(선택)" value="${escapeHtml(v('itemCode'))}" style="font-family:monospace">
    </div>

    <div style="margin:18px 0 10px;padding:10px 12px;background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:7px">
      <div style="font-size:11.5px;font-weight:700;color:var(--gold-lt);margin-bottom:8px">💰 비용 (거래명세서용)</div>
      <div class="form-r-3" style="margin:0">
        <div class="form-r" style="margin:0"><label>입고원가</label>
          <input type="number" id="smp_costPrice" placeholder="0" min="0" value="${v('costPrice')||''}">
        </div>
        <div class="form-r" style="margin:0"><label>샘플단가</label>
          <input type="number" id="smp_unitPrice" placeholder="0" min="0" value="${v('unitPrice')||''}">
        </div>
        <div class="form-r" style="margin:0"><label>개발비</label>
          <input type="number" id="smp_devCost" placeholder="0" min="0" value="${v('devCost')||''}">
        </div>
      </div>
    </div>

    <div class="form-r">
      <label>메모/요청사항</label>
      <textarea id="smp_desc" placeholder="(선택)">${escapeHtml(v('desc'))}</textarea>
    </div>
    <div class="form-r">
      <label>📷 사진</label>
      ${photoWidget('smpAdd', _photoGet('smpAdd'))}
    </div>
    <div class="spacer"></div>
    <button class="btn-primary" onclick="saveSmp(${smpId||'null'})">${isEdit?'✓ 저장':'샘플 등록'}</button>
    ${isEdit ? `<div class="spacer"></div><button class="btn-danger" onclick="deleteSmp(${smpId})">🗑 삭제</button>` : ''}
  `;
  openModal(isEdit ? '💎 샘플 수정 — '+escapeHtml(s.name||'') : '💎 샘플 의뢰 등록', body);
}

async function saveSmp(smpId){
  const name = document.getElementById('smp_name').value.trim();
  const due = document.getElementById('smp_due').value;
  if(!name){ showToast('샘플명을 입력해주세요','warn'); return; }
  if(!due){ showToast('납기일을 입력해주세요','warn'); return; }
  const isEdit = !!smpId;
  const old = isEdit ? samples.find(x=>x.id==smpId) : null;

  const updated = {
    ...(old||{}),
    id: isEdit ? old.id : Date.now(),
    name,
    type: document.getElementById('smp_type').value,
    status: document.getElementById('smp_status').value,
    manager: document.getElementById('smp_manager').value.trim(),
    reqDate: document.getElementById('smp_reqDate').value || todayStr(),
    due,
    factShip: document.getElementById('smp_factShip').value,
    mat: document.getElementById('smp_mat').value.trim(),
    plating: document.getElementById('smp_plating').value,
    sz1: document.getElementById('smp_sz1').value.trim(),
    sz2: document.getElementById('smp_sz2').value.trim(),
    wt: document.getElementById('smp_wt').value.trim(),
    itemCode: document.getElementById('smp_itemCode').value.trim(),
    costPrice: +document.getElementById('smp_costPrice').value || 0,
    unitPrice: +document.getElementById('smp_unitPrice').value || 0,
    devCost: +document.getElementById('smp_devCost').value || 0,
    desc: document.getElementById('smp_desc').value.trim(),
    imgs: _photoGet('smpAdd'),
    createdAt: (old && old.createdAt) || new Date().toISOString()
  };

  // 노션 동기화
  if(notionCfg && notionCfg.workerUrl && notionCfg.smpDb){
    showToast('🔄 노션 ' + (isEdit?'수정':'등록') + ' 중...','info');
    try{
      // 노션은 '완료'를 '확정'으로 받음
      const notionStatus = updated.status === '완료' ? '확정' : updated.status;
      const props = {
        "샘플명":{title:[{text:{content:name}}]},
        "품번":{rich_text:[{text:{content:updated.itemCode||''}}]},
        "담당자_고객사":{rich_text:[{text:{content:updated.manager||''}}]},
        "소재":{rich_text:[{text:{content:updated.mat||''}}]},
        "사이즈":{rich_text:[{text:{content:updated.sz1||''}}]},
        "호수":{rich_text:[{text:{content:updated.sz2||''}}]},
        "중량":{rich_text:[{text:{content:updated.wt||''}}]},
        "메모":{rich_text:[{text:{content:updated.desc||''}}]},
        "유형":{select:{name:updated.type}},
        "상태":{select:{name:notionStatus}},
        "의뢰일":{date:{start:updated.reqDate}},
        "납기일":{date:{start:updated.due}},
        "입고원가":{number:updated.costPrice||0},
        "샘플단가":{number:updated.unitPrice||0},
        "개발비":{number:updated.devCost||0},
        "예시이미지JSON":{rich_text:[{text:{content:JSON.stringify(updated.imgs||[]).slice(0,2000)}}]}
      };
      if(updated.plating) props["도금"] = {select:{name:updated.plating}};
      if(updated.factShip) props["공장출고일"] = {date:{start:updated.factShip}};

      if(isEdit && updated._notionId){
        await nUpdate(updated._notionId, props);
      } else {
        const res = await nCreate(notionCfg.smpDb, props);
        if(res && res.id) updated._notionId = res.id;
      }
      showToast('✓ ' + (isEdit?'수정':'등록') + ' 완료', 'success');
    }catch(e){
      console.error(e);
      showToast('로컬에만 저장됨','warn');
    }
  } else {
    showToast('✓ ' + (isEdit?'수정됨':'등록됨') + ' (로컬)','success');
  }

  if(isEdit){
    const i = samples.findIndex(x=>x.id==smpId);
    if(i>=0) samples[i] = updated;
  } else {
    samples.unshift(updated);
  }
  saveAll();
  closeModal();
  renderSmpList();
  renderDash();
}

async function deleteSmp(smpId){
  const s = samples.find(x=>x.id==smpId);
  if(!s) return;
  if(!confirm(`샘플 "${s.name}"을(를) 삭제할까요?\n노션에서도 함께 삭제됩니다.`)) return;
  if(s._notionId && notionCfg && notionCfg.workerUrl){
    showToast('🔄 삭제 중...','info');
    try{
      // Notion은 archived:true로 삭제
      await notionProxy(`/pages/${s._notionId}`, {method:'PATCH', body:JSON.stringify({archived:true})});
    }catch(e){
      console.warn('노션 삭제 실패:', e);
      showToast('노션 삭제 실패 — 로컬만 삭제','warn');
    }
  }
  samples = samples.filter(x=>x.id!=smpId);
  saveAll();
  closeModal();
  renderSmpList();
  renderDash();
  showToast('✓ 삭제됨','success');
}

// ──── 고객사 자동완성 드롭다운 ────
// 표시 항목: ① 고객사 DB ② 입출고 이력에서 추출한 공장 이름 ③ 중국공장 기본 옵션
function renderIoVendorDropdown(q){
  const dd = document.getElementById('ioVendorDropdown');
  if(!dd) return;
  q = (q||'').trim().toLowerCase();

  // 1) 고객사 DB에서 매칭
  const clientMatches = (clients||[]).filter(c=>{
    if(!q) return true; // 빈 검색어면 전체
    const nm = (c.name||'').toLowerCase();
    const init = (c.initials||'').toLowerCase();
    const clean = nm.replace(/^\(.*?\)/,'').trim();
    return nm.includes(q) || init.includes(q) || clean.includes(q);
  });

  // 2) 입출고 이력에서 추출한 공장/거래처명 (DB에 없는 직접 입력 이력)
  //    중국공장, 중국공장A, 한국공장 등 사용자가 직접 입력했던 이름들
  const usedVendors = [...new Set(
    (ioItems||[])
      .map(io => (io.vendor||'').trim())
      .filter(Boolean)
  )];
  const knownNames = new Set((clients||[]).map(c => (c.name||'').trim()));
  // 기본 옵션 + 사용자 이력에서 추출
  const factoryDefaults = ['중국공장', '한국공장'];
  const factoryOpts = [
    ...factoryDefaults,
    ...usedVendors.filter(v => !knownNames.has(v) && !factoryDefaults.includes(v))
  ].filter(v=>{
    if(!q) return true;
    return v.toLowerCase().includes(q);
  });

  const totalCount = clientMatches.length + factoryOpts.length;
  if(!totalCount){
    dd.style.display = 'none';
    return;
  }

  let html = '';
  // 고객사 섹션
  if(clientMatches.length){
    html += `<div style="padding:6px 10px;font-size:10px;font-weight:700;color:var(--t3);background:var(--s2);text-transform:uppercase;letter-spacing:.5px">고객사</div>`;
    html += clientMatches.slice(0, 6).map(c=>{
      const initial = (c.initials||'').trim().toUpperCase() || (c.name||'').slice(0,2).toUpperCase();
      const color = strColor(c.name||'');
      return `<div onmousedown="_pickIoVendor('${escapeHtml(c.name||'').replace(/'/g,"\\'")}')" style="display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--bdr-lt)" onmouseover="this.style.background='var(--s2)'" onmouseout="this.style.background=''">
        <span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;font-size:9.5px;font-weight:700;color:#fff;background:${color};flex-shrink:0">${initial}</span>
        <span style="font-size:12.5px;color:var(--t1);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(c.name||'')}</span>
      </div>`;
    }).join('');
  }
  // 공장 섹션
  if(factoryOpts.length){
    html += `<div style="padding:6px 10px;font-size:10px;font-weight:700;color:var(--t3);background:var(--s2);text-transform:uppercase;letter-spacing:.5px">공장 / 기타</div>`;
    html += factoryOpts.slice(0, 6).map(name=>{
      return `<div onmousedown="_pickIoVendor('${escapeHtml(name).replace(/'/g,"\\'")}')" style="display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--bdr-lt)" onmouseover="this.style.background='var(--s2)'" onmouseout="this.style.background=''">
        <span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;font-size:11px;flex-shrink:0">🏭</span>
        <span style="font-size:12.5px;color:var(--t1);flex:1">${escapeHtml(name)}</span>
      </div>`;
    }).join('');
  }
  // 직접 입력 안내 (q가 있고 매칭이 없을 때 자연스럽게)
  const hasExactMatch = (clientMatches.some(c => (c.name||'').toLowerCase() === q) ||
                        factoryOpts.some(f => f.toLowerCase() === q));
  if(q && !hasExactMatch){
    html += `<div style="padding:8px 10px;font-size:11px;color:var(--t3);background:var(--s2);text-align:center;border-top:1px solid var(--bdr-lt)">직접 입력 그대로 사용하려면 그냥 두세요</div>`;
  }

  dd.innerHTML = html;
  dd.style.display = 'block';
}
function hideIoVendorDropdown(){
  const dd = document.getElementById('ioVendorDropdown');
  if(dd) dd.style.display = 'none';
}
function _pickIoVendor(name){
  const inp = document.getElementById('io_vendor');
